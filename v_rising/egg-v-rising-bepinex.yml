name: V Rising (BepInEx)
author: thexylo@pm.me
description: >-
  Awaken as a vampire: hunt for blood, build your castle and rule the land, alone or in clans, PvE
  or PvP. The Windows-only V Rising dedicated server (Steam app 1829350) runs through Proton, with
  the BepInEx mod loader (BepInExPack for V Rising from Thunderstore) for server-side plugins.
features:
  - steam_disk_space
docker_images:
  Proton: ghcr.io/caloptreyx/steamcmd:proton
file_denylist: []
startup_commands:
  # Same as the V Rising egg, plus the BepInEx loader: Wine is told to load the pack's winhttp.dll
  # (Doorstop) before its own, which starts BepInEx and the plugins in BepInEx/plugins.
  # The server reads its host settings from VR_* environment variables (the official override
  # mechanism), so the panel variables apply on every start without editing ServerHostSettings.json;
  # empty optional ones are unset so the json (or the default) applies. Its own output is unusable
  # under Proton, so the log file is streamed to the console; it reads no console input (use RCON).
  # Unity needs a display, so it gets a virtual one (Xvfb, in its own session so the stop signal
  # does not take it away mid-save). Wine runs the server in its own process group, so the stop
  # signal never reaches it: the shell forwards SIGINT to it (Ctrl+C, which makes it save and exit)
  # and waits for it.
  Default: >-
    : > VRisingServer.log; rm -f /tmp/.X99-lock;
    for v in VR_PASSWORD VR_DESCRIPTION VR_PRESET VR_DIFFICULTY_PRESET; do [ -n "${!v}" ] || unset "${v}"; done;
    export VR_GAME_PORT={{SERVER_PORT}} VR_ADDRESS=0.0.0.0 VR_RCON_ENABLED=$( [ -n "${VR_RCON_PASSWORD}" ] && echo true || echo false );
    export WINEDLLOVERRIDES="winhttp=n,b";
    setsid Xvfb :99 -screen 0 1024x768x24 -nolisten tcp 2>/dev/null & XVFB=$!;
    DISPLAY=:99 proton run ./VRisingServer.exe -persistentDataPath save-data
    -logFile /home/container/VRisingServer.log {{EXTRA_ARGS}} & SRV=$!;
    trap 'pkill -INT -f "VRisingServer\.exe"' INT;
    tail -n +1 -F VRisingServer.log --pid=${SRV} 2>/dev/null &
    while kill -0 ${SRV} 2>/dev/null; do wait ${SRV}; done; kill ${XVFB} 2>/dev/null
force_outgoing_ip: false
separate_port: false
config:
  files: {}
  startup:
    done:
      - Startup Completed
    strip_ansi: false
  stop:
    type: signal
    value: SIGINT
scripts:
  installation:
    container: ghcr.io/caloptreyx/installers:debian
    entrypoint: bash
    content: |
      #!/bin/bash
      # V Rising dedicated server + BepInEx installation script (Windows server, run through Proton)
      #
      # Server files: /mnt/server
      # Installer image: ghcr.io/caloptreyx/installers:debian

      SERVER_BINARY=/mnt/server/VRisingServer.exe

      # Calagopus Wings ignores the installer exit code and only marks the installation as failed when
      # a reason is written to INSTALL_STATUS_FILE. Pterodactyl Wings leaves it unset and uses the exit code.
      fail() {
          echo -e "\n[ERROR] $1\n"
          if [[ -n "${INSTALL_STATUS_FILE}" ]]; then
              echo "$1" > "${INSTALL_STATUS_FILE}"
          fi
          exit 1
      }

      ## download and install steamcmd
      cd /tmp || fail "cannot enter /tmp"
      mkdir -p /mnt/server/steamcmd /mnt/server/steamapps # steamapps: avoids a steamcmd disk write error
      curl -fsSL -o steamcmd.tar.gz https://steamcdn-a.akamaihd.net/client/installer/steamcmd_linux.tar.gz \
          || fail "could not download SteamCMD"
      tar -xzf steamcmd.tar.gz -C /mnt/server/steamcmd || fail "could not extract SteamCMD"
      cd /mnt/server/steamcmd || fail "cannot enter /mnt/server/steamcmd"

      # SteamCMD fails otherwise, even as root; ownership is fixed by the daemon after install.
      chown -R root:root /mnt
      export HOME=/mnt/server

      ## install the Windows server; the first attempt often fails with "Missing configuration"
      for attempt in 1 2 3; do
          ./steamcmd.sh +force_install_dir /mnt/server +@sSteamCmdForcePlatformType windows +login anonymous \
              +app_update "${SRCDS_APPID}" validate +quit && [[ -f "${SERVER_BINARY}" ]] && break
          echo "SteamCMD attempt ${attempt} failed, retrying..."
          sleep 5
      done
      [[ -f "${SERVER_BINARY}" ]] || fail "SteamCMD could not install app ${SRCDS_APPID}; check the install log and free disk space"

      ## steamclient libraries
      mkdir -p /mnt/server/.steam/sdk32 /mnt/server/.steam/sdk64
      cp -v linux32/steamclient.so /mnt/server/.steam/sdk32/steamclient.so
      cp -v linux64/steamclient.so /mnt/server/.steam/sdk64/steamclient.so

      mkdir -p /mnt/server/save-data/Settings

      ## BepInEx: the BepInExPack for V Rising from Thunderstore (latest, or BEPINEX_VERSION).
      ## Its files go over the server root; plugins and plugin configs in BepInEx/ are kept.
      # The installer's /tmp is too small for the pack (70 MB unpacked), so it is unpacked in the server.
      mkdir -p /mnt/server/.bepinex-install && cd /mnt/server/.bepinex-install || fail "cannot create /mnt/server/.bepinex-install"
      if [[ -z "${BEPINEX_VERSION}" || "${BEPINEX_VERSION}" == "latest" ]]; then
          BEPINEX_VERSION=$(curl -fsSL https://thunderstore.io/api/experimental/package/BepInEx/BepInExPack_V_Rising/ | jq -r '.latest.version_number')
          [[ "${BEPINEX_VERSION}" =~ ^[0-9.]+$ ]] || fail "could not look up the latest BepInExPack for V Rising on Thunderstore"
      fi
      echo "Installing BepInExPack for V Rising ${BEPINEX_VERSION}"
      curl -fsSL -o bepinex.zip "https://thunderstore.io/package/download/BepInEx/BepInExPack_V_Rising/${BEPINEX_VERSION}/" \
          || fail "could not download BepInExPack for V Rising ${BEPINEX_VERSION}"
      rm -rf bepinex && mkdir bepinex && unzip -q -o bepinex.zip -d bepinex </dev/null || fail "could not extract BepInExPack"
      [[ -f bepinex/BepInExPack_V_Rising/winhttp.dll ]] || fail "the BepInExPack has no winhttp.dll"
      cp -r bepinex/BepInExPack_V_Rising/. /mnt/server/ || fail "could not copy BepInEx into the server"
      mkdir -p /mnt/server/BepInEx/plugins
      cd /mnt/server && rm -rf /mnt/server/.bepinex-install

      echo "-----------------------------------------"
      echo "Installation completed..."
      echo "-----------------------------------------"
variables:
  - name: Server Name
    description: Name shown in the server list.
    order: 1
    env_variable: VR_NAME
    default_value: V Rising Server
    user_viewable: true
    user_editable: true
    rules: "required|string|max:64"
  - name: Description
    description: Short description shown in the server list and in chat when players connect.
    order: 2
    env_variable: VR_DESCRIPTION
    default_value: ""
    user_viewable: true
    user_editable: true
    rules: "nullable|string|max:256"
  - name: Server Password
    description: Password players need to join. Leave empty for no password.
    order: 3
    env_variable: VR_PASSWORD
    default_value: ""
    user_viewable: true
    user_editable: true
    secret: true
    rules: "nullable|string|max:64"
  - name: Max Players
    description: Maximum number of players at once (at most 128).
    order: 4
    env_variable: VR_MAX_USERS
    default_value: "40"
    user_viewable: true
    user_editable: true
    rules: "required|integer|between:1,128"
  - name: Save Name
    description: >-
      Name of the world save (a folder in save-data/Saves/v4/). A new name starts a new world.
      Letters, digits, _ and -.
    order: 5
    env_variable: VR_SAVE_NAME
    default_value: world1
    user_viewable: true
    user_editable: true
    rules: 'required|string|max:64|regex:/^[\w-]+$/'
  - name: Game Settings Preset
    description: >-
      Game settings preset (a file in VRisingServer_Data/StreamingAssets/GameSettingPresets), e.g.
      StandardPvP, StandardPvE, DuoPvP, HardcorePvP, Level70PvE. Leave empty for the settings in
      save-data/Settings/ServerGameSettings.json (or the game's defaults).
    order: 6
    env_variable: VR_PRESET
    default_value: StandardPvE
    user_viewable: true
    user_editable: true
    rules: 'nullable|string|max:64|regex:/^[\w-]*$/'
  - name: Difficulty Preset
    description: Difficulty preset. Leave empty for the game's default.
    order: 7
    env_variable: VR_DIFFICULTY_PRESET
    default_value: Difficulty_Normal
    user_viewable: true
    user_editable: true
    rules: "nullable|in:Difficulty_Easy,Difficulty_Normal,Difficulty_Brutal"
  - name: Query Port
    description: UDP port for Steam server queries (server list). Needs its own allocation.
    order: 8
    env_variable: VR_QUERY_PORT
    default_value: "27016"
    user_viewable: true
    user_editable: false
    rules: "required|integer|between:1024,65535"
  - name: List on Steam
    description: List the server in the Steam server list. (true / false)
    order: 9
    env_variable: VR_LIST_ON_STEAM
    default_value: "true"
    user_viewable: true
    user_editable: true
    rules: "required|in:true,false"
  - name: List on EOS
    description: >-
      List the server in the Epic Online Services list, which the game searches by default.
      (true / false)
    order: 10
    env_variable: VR_LIST_ON_EOS
    default_value: "true"
    user_viewable: true
    user_editable: true
    rules: "required|in:true,false"
  - name: Secure (VAC)
    description: Turn on VAC protection; VAC-banned players cannot connect. (true / false)
    order: 11
    env_variable: VR_SECURE
    default_value: "true"
    user_viewable: true
    user_editable: true
    rules: "required|in:true,false"
  - name: Auto Save Interval
    description: Seconds between automatic saves.
    order: 12
    env_variable: VR_SAVE_INTERVAL
    default_value: "120"
    user_viewable: true
    user_editable: true
    rules: "required|integer|between:30,3600"
  - name: Auto Save Count
    description: Number of automatic saves to keep.
    order: 13
    env_variable: VR_SAVE_COUNT
    default_value: "20"
    user_viewable: true
    user_editable: true
    rules: "required|integer|between:1,100"
  - name: RCON Password
    description: >-
      Password for the remote console (RCON). Leave empty to turn RCON off. RCON uses the RCON Port.
    order: 14
    env_variable: VR_RCON_PASSWORD
    default_value: ""
    user_viewable: true
    user_editable: true
    secret: true
    rules: "nullable|string|max:64"
  - name: RCON Port
    description: TCP port for RCON. Needs its own allocation when RCON is on.
    order: 15
    env_variable: VR_RCON_PORT
    default_value: "25575"
    user_viewable: true
    user_editable: false
    rules: "required|integer|between:1024,65535"
  - name: Extra Arguments
    description: Additional launch parameters, e.g. -lowerFPSWhenEmpty true -resetDaysInterval 14.
    order: 16
    env_variable: EXTRA_ARGS
    default_value: ""
    user_viewable: true
    user_editable: true
    rules: "nullable|string|max:512"
  - name: BepInEx Version
    description: >-
      Version of the BepInExPack for V Rising on Thunderstore (e.g. 1.733.2), or latest. Applied on
      reinstall.
    order: 17
    env_variable: BEPINEX_VERSION
    default_value: latest
    user_viewable: true
    user_editable: true
    rules: [required, string, "max:16", 'regex:/^(latest|[0-9.]+)$/']
  - name: Auto Update
    description: Update the server through SteamCMD on every start. (1 = on, 0 = off)
    order: 18
    env_variable: AUTO_UPDATE
    default_value: "1"
    user_viewable: true
    user_editable: true
    rules: "required|in:0,1"
  - name: Steam App ID
    description: Steam app id of the V Rising dedicated server.
    order: 19
    env_variable: SRCDS_APPID
    default_value: "1829350"
    user_viewable: false
    user_editable: false
    rules: "required|string|in:1829350"
  - name: Windows Install
    description: The server is Windows-only; auto updates must download the Windows files.
    order: 20
    env_variable: WINDOWS_INSTALL
    default_value: "1"
    user_viewable: false
    user_editable: false
    rules: "required|in:1"
