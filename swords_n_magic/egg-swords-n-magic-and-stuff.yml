name: "Swords 'n Magic and Stuff"
author: thexylo@pm.me
description: >-
  Swords 'n Magic and Stuff, the cozy co-op open-world RPG: explore, fight, quest, cook and dress
  up with up to 16 players on a shared server that resets daily. The Windows-only dedicated server
  (Steam app 2058450) runs through Proton.
features:
  - steam_disk_space
docker_images:
  Proton: ghcr.io/caloptreyx/steamcmd:proton
file_denylist: []
startup_commands:
  # The server reads its settings from SNM_* environment variables (the panel variables below),
  # which override SNM2020/Saved/Config/WindowsServer/Game.ini; ports are launch arguments. It needs
  # a display (Xvfb). Its Unreal log is streamed to the console; it reads no console input. The
  # stop signal (SIGINT) is forwarded to the server.
  Default: >-
    LOG=SNM2020/Saved/Logs/SNM2020.log; mkdir -p SNM2020/Saved/Logs; rm -f "${LOG}"; touch "${LOG}";
    xvfb-run -a proton run ./SNM2020/Binaries/Win64/SNMASServer-Win64-Shipping.exe
    -port={{SERVER_PORT}} -QueryPort={{QUERY_PORT}} -log >/dev/null 2>&1 & SRV=$!;
    trap 'pkill -INT -f "SNMASServer-Win64-Shipping\.exe"' INT TERM;
    tail -n +1 -F "${LOG}" --pid=${SRV} 2>/dev/null &
    while kill -0 ${SRV} 2>/dev/null; do wait ${SRV}; done
force_outgoing_ip: false
separate_port: false
config:
  files: {}
  startup:
    done:
      - "Succeeded to create Steam session"
    strip_ansi: true
  stop:
    type: signal
    value: SIGINT
scripts:
  installation:
    container: ghcr.io/caloptreyx/installers:debian
    entrypoint: bash
    content: |
      #!/bin/bash
      # Swords 'n Magic and Stuff dedicated server installation script (Windows server, run through Proton)
      #
      # Server files: /mnt/server
      # Installer image: ghcr.io/caloptreyx/installers:debian

      SERVER_BINARY=/mnt/server/SNM2020/Binaries/Win64/SNMASServer-Win64-Shipping.exe

      # Calagopus Wings ignores the installer exit code and only marks the installation as failed when
      # a reason is written to INSTALL_STATUS_FILE. Pterodactyl Wings leaves it unset and uses the exit code.
      fail() {
          echo -e "\n[ERROR] $1\n"
          if [[ -n "${INSTALL_STATUS_FILE}" ]]; then
              echo "$1" > "${INSTALL_STATUS_FILE}"
          fi
          exit 1
      }

      ## download and install steamcmd
      cd /tmp || fail "cannot enter /tmp"
      mkdir -p /mnt/server/steamcmd /mnt/server/steamapps # steamapps: avoids a steamcmd disk write error
      curl -fsSL -o steamcmd.tar.gz https://steamcdn-a.akamaihd.net/client/installer/steamcmd_linux.tar.gz \
          || fail "could not download SteamCMD"
      tar -xzf steamcmd.tar.gz -C /mnt/server/steamcmd || fail "could not extract SteamCMD"
      cd /mnt/server/steamcmd || fail "cannot enter /mnt/server/steamcmd"

      # SteamCMD fails otherwise, even as root; ownership is fixed by the daemon after install.
      chown -R root:root /mnt
      export HOME=/mnt/server

      for attempt in 1 2 3; do
          ./steamcmd.sh +force_install_dir /mnt/server +@sSteamCmdForcePlatformType windows +login anonymous \
              +app_update "${SRCDS_APPID}" validate +quit && [[ -f "${SERVER_BINARY}" ]] && break
          echo "SteamCMD attempt ${attempt} failed, retrying..."
          sleep 5
      done
      [[ -f "${SERVER_BINARY}" ]] || fail "SteamCMD could not install app ${SRCDS_APPID}; check the install log and free disk space"

      ## steamclient libraries
      mkdir -p /mnt/server/.steam/sdk32 /mnt/server/.steam/sdk64
      cp -v linux32/steamclient.so /mnt/server/.steam/sdk32/steamclient.so
      cp -v linux64/steamclient.so /mnt/server/.steam/sdk64/steamclient.so

      ## Game.ini: created once from the shipped template, without its placeholder owner id (the
      ## server refuses to start with 00000000000000000; the owner comes from SNM_OWNER_STEAM_ID)
      CONFIG_DIR=/mnt/server/SNM2020/Saved/Config/WindowsServer
      mkdir -p "${CONFIG_DIR}"
      if [[ ! -f "${CONFIG_DIR}/Game.ini" ]]; then
          grep -v '^DedSrv_OwnerSteamID=' /mnt/server/SNM2020/Content/Docs/Dedicated-Server-Game.ini > "${CONFIG_DIR}/Game.ini" \
              || fail "the server has no SNM2020/Content/Docs/Dedicated-Server-Game.ini"
      fi

      echo "-----------------------------------------"
      echo "Installation completed..."
      echo "-----------------------------------------"
variables:
  - name: Server Name
    description: >-
      2 to 5 different words from the game's approved word list (SNM2020/Saved/Logs/Allowed-Words.txt
      after the first start), for example "Goblin Sword". Leave empty for a random name on every start.
    order: 1
    env_variable: SNM_NAME
    default_value: ""
    user_viewable: true
    user_editable: true
    rules: 'nullable|string|max:64|regex:/^[A-Za-z]+( [A-Za-z]+){1,4}$/'
  - name: Owner Steam ID
    description: SteamID64 of the server owner, who gets the admin panel. Required; the server refuses to start without a valid one.
    order: 2
    env_variable: SNM_OWNER_STEAM_ID
    default_value: ""
    user_viewable: true
    user_editable: true
    rules: 'required|string|regex:/^7656119\d{10}$/'
  - name: Server Password
    description: Password players need to join. Leave empty for no password.
    order: 3
    env_variable: SNM_PASSWORD
    default_value: ""
    user_viewable: true
    user_editable: true
    secret: true
    rules: 'nullable|string|max:64|regex:/^\S*$/'
  - name: Max Players
    description: Maximum number of players (the developer has tested up to 16).
    order: 4
    env_variable: SNM_MAX_PLAYERS
    default_value: "16"
    user_viewable: true
    user_editable: true
    rules: "required|integer|between:1,16"
  - name: Days Until Reset
    description: Days between world resets (1 is strongly recommended by the developer).
    order: 5
    env_variable: SNM_DAYS_UNTIL_RESET
    default_value: "1"
    user_viewable: true
    user_editable: true
    rules: "required|integer|between:1,30"
  - name: Reset Time Of Day
    description: Local time of the daily reset, HH:MM in 24 hour format.
    order: 6
    env_variable: SNM_RESET_TIME_OF_DAY
    default_value: "00:00"
    user_viewable: true
    user_editable: true
    rules: 'required|string|regex:/^([01]\d|2[0-3]):[0-5]\d$/'
  - name: Query Port
    description: UDP port for Steam server queries. Needs its own allocation.
    order: 7
    env_variable: QUERY_PORT
    default_value: "27015"
    user_viewable: true
    user_editable: false
    rules: "required|integer|between:1024,65535"
  - name: Auto Update
    description: Update the server through SteamCMD on every start. (1 = on, 0 = off)
    order: 8
    env_variable: AUTO_UPDATE
    default_value: "1"
    user_viewable: true
    user_editable: true
    rules: "required|in:0,1"
  - name: Windows Install
    description: Download the Windows build through SteamCMD.
    order: 9
    env_variable: WINDOWS_INSTALL
    default_value: "1"
    user_viewable: false
    user_editable: false
    rules: "required|in:1"
  - name: Steam App ID
    description: Steam app id of the Swords 'n Magic and Stuff dedicated server.
    order: 10
    env_variable: SRCDS_APPID
    default_value: "2058450"
    user_viewable: false
    user_editable: false
    rules: "required|string|in:2058450"
