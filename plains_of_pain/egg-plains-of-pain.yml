name: Plains of Pain
author: thexylo@pm.me
description: >-
  Plains of Pain, the top-down open-world survival game set in a post-apocalyptic desert: scavenge,
  craft, build a base and survive together. Native Linux dedicated server (Steam app 2227360).
features:
  - steam_disk_space
docker_images:
  SteamCMD Debian: ghcr.io/caloptreyx/steamcmd:debian
file_denylist: []
startup_commands:
  # The server reads configs/server.json (created once from configs/default.json); name, password,
  # player limit, ports and the world settings are written into it on every start. The Unity log
  # goes to the console. The server reads no console input; the stop signal (SIGINT) shuts it down.
  Default: >-
    ./PlainsOfPain.x86_64 -nographics -batchmode -logFile - -config "configs/server.json"
    -port {{SERVER_PORT}} -queryPort {{QUERY_PORT}}
force_outgoing_ip: false
separate_port: false
config:
  files:
    configs/server.json:
      parser: json
      create_new: false
      replace:
        - match: serverName
          replace_with: '"{{env.SERVER_NAME}}"'
        - match: password
          replace_with: '"{{env.SERVER_PASSWORD}}"'
        - match: maxPlayers
          replace_with: "{{env.MAX_PLAYERS}}"
        - match: port
          replace_with: "{{server.build.default.port}}"
        - match: queryPort
          replace_with: "{{env.QUERY_PORT}}"
        - match: worldId
          replace_with: "{{env.WORLD_ID}}"
        - match: mapId
          replace_with: "{{env.MAP_ID}}"
        - match: seed
          replace_with: "{{env.SEED}}"
        - match: difficulty
          replace_with: "{{env.DIFFICULTY}}"
        - match: worldSize
          replace_with: "{{env.WORLD_SIZE}}"
  startup:
    done:
      - "Set Game State: RUNNING"
    strip_ansi: true
  stop:
    type: signal
    value: SIGINT
scripts:
  installation:
    container: ghcr.io/caloptreyx/installers:debian
    entrypoint: bash
    content: |
      #!/bin/bash
      # Plains of Pain dedicated server installation script (native Linux build)
      #
      # Server files: /mnt/server
      # Installer image: ghcr.io/caloptreyx/installers:debian

      SERVER_BINARY=/mnt/server/PlainsOfPain.x86_64

      # Calagopus Wings ignores the installer exit code and only marks the installation as failed when
      # a reason is written to INSTALL_STATUS_FILE. Pterodactyl Wings leaves it unset and uses the exit code.
      fail() {
          echo -e "\n[ERROR] $1\n"
          if [[ -n "${INSTALL_STATUS_FILE}" ]]; then
              echo "$1" > "${INSTALL_STATUS_FILE}"
          fi
          exit 1
      }

      ## download and install steamcmd
      cd /tmp || fail "cannot enter /tmp"
      mkdir -p /mnt/server/steamcmd /mnt/server/steamapps # steamapps: avoids a steamcmd disk write error
      curl -fsSL -o steamcmd.tar.gz https://steamcdn-a.akamaihd.net/client/installer/steamcmd_linux.tar.gz \
          || fail "could not download SteamCMD"
      tar -xzf steamcmd.tar.gz -C /mnt/server/steamcmd || fail "could not extract SteamCMD"
      cd /mnt/server/steamcmd || fail "cannot enter /mnt/server/steamcmd"

      # SteamCMD fails otherwise, even as root; ownership is fixed by the daemon after install.
      chown -R root:root /mnt
      export HOME=/mnt/server

      ## install the game; downloads occasionally abort with a steamcmd state error
      for attempt in 1 2 3; do
          ./steamcmd.sh +force_install_dir /mnt/server +login anonymous \
              +app_update "${SRCDS_APPID}" validate +quit && [[ -f "${SERVER_BINARY}" ]] && break
          echo "SteamCMD attempt ${attempt} failed, retrying..."
          sleep 5
      done
      [[ -f "${SERVER_BINARY}" ]] || fail "SteamCMD could not install app ${SRCDS_APPID}; check the install log and free disk space"

      ## steamclient libraries
      mkdir -p /mnt/server/.steam/sdk32 /mnt/server/.steam/sdk64
      cp -v linux32/steamclient.so /mnt/server/.steam/sdk32/steamclient.so
      cp -v linux64/steamclient.so /mnt/server/.steam/sdk64/steamclient.so

      chmod +x "${SERVER_BINARY}"

      ## configs/server.json: created once from the shipped defaults, plus the keys the panel manages
      ## that default.json lacks (password) and a save folder in the server root (userdir)
      cd /mnt/server || fail "cannot enter /mnt/server"
      if [[ ! -f configs/server.json ]]; then
          jq '. + {password: "", userdir: "data"}' configs/default.json > configs/server.json \
              || fail "could not create configs/server.json from configs/default.json"
      fi
      jq -e 'has("password")' configs/server.json > /dev/null \
          || { jq '. + {password: ""}' configs/server.json > configs/server.json.new && mv configs/server.json.new configs/server.json; }

      echo "-----------------------------------------"
      echo "Installation completed..."
      echo "-----------------------------------------"
variables:
  - name: Server Name
    description: Name shown in the server browser.
    order: 1
    env_variable: SERVER_NAME
    default_value: Plains of Pain Server
    user_viewable: true
    user_editable: true
    rules: 'required|string|max:64|regex:/^[^"\\\r\n]+$/'
  - name: Server Password
    description: Password players need to join. Leave empty for no password.
    order: 2
    env_variable: SERVER_PASSWORD
    default_value: ""
    user_viewable: true
    user_editable: true
    secret: true
    rules: 'nullable|string|max:64|regex:/^[^"\\\s]*$/'
  - name: Max Players
    description: Maximum number of players.
    order: 3
    env_variable: MAX_PLAYERS
    default_value: "10"
    user_viewable: true
    user_editable: true
    rules: "required|integer|between:1,64"
  - name: World ID
    description: Save slot of the world. A new ID starts a new world.
    order: 4
    env_variable: WORLD_ID
    default_value: "1"
    user_viewable: true
    user_editable: true
    rules: "required|integer|between:0,999"
  - name: Map ID
    description: Map of a new world.
    order: 5
    env_variable: MAP_ID
    default_value: "768"
    user_viewable: true
    user_editable: true
    rules: "required|integer|between:0,65535"
  - name: Seed
    description: Seed of a new world.
    order: 6
    env_variable: SEED
    default_value: "23456"
    user_viewable: true
    user_editable: true
    rules: "required|integer|between:0,2147483647"
  - name: Difficulty
    description: Difficulty of a new world.
    order: 7
    env_variable: DIFFICULTY
    default_value: "1"
    user_viewable: true
    user_editable: true
    rules: "required|integer|between:0,5"
  - name: World Size
    description: Size of a new world.
    order: 8
    env_variable: WORLD_SIZE
    default_value: "21"
    user_viewable: true
    user_editable: true
    rules: "required|integer|between:1,64"
  - name: Query Port
    description: UDP port for Steam server queries. Needs its own allocation.
    order: 9
    env_variable: QUERY_PORT
    default_value: "27016"
    user_viewable: true
    user_editable: false
    rules: "required|integer|between:1024,65535"
  - name: Auto Update
    description: Update the server through SteamCMD on every start. (1 = on, 0 = off)
    order: 10
    env_variable: AUTO_UPDATE
    default_value: "1"
    user_viewable: true
    user_editable: true
    rules: "required|in:0,1"
  - name: Steam App ID
    description: Steam app id of the Plains of Pain dedicated server.
    order: 11
    env_variable: SRCDS_APPID
    default_value: "2227360"
    user_viewable: false
    user_editable: false
    rules: "required|string|in:2227360"
