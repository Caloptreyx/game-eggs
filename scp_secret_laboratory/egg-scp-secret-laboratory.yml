name: "SCP: Secret Laboratory"
author: thexylo@pm.me
description: >-
  SCP: Secret Laboratory, the multiplayer horror game set in the SCP Foundation: escape as Class-D
  or scientist, contain or breach as MTF, Chaos Insurgency or SCPs. Native Linux dedicated server
  (Steam app 996560) run through LocalAdmin.
features:
  - steam_disk_space
docker_images:
  SteamCMD Debian: ghcr.io/caloptreyx/steamcmd:debian
file_denylist: []
startup_commands:
  # The server only starts once the owner has accepted Northwood's EULA (Accept EULA). Its settings
  # live in ~/.config/SCP Secret Laboratory/config/<port>/config_gameplay.txt; the panel values are
  # written there on every start (missing keys are added; the game fills in all other settings).
  # LocalAdmin runs the game, restarts it at round end when asked to, and takes console commands
  # (exit, stop, rnr, players, ...); its own automatic restarts are off, the panel restarts crashed
  # servers. LocalAdmin is a .NET program and the image has no ICU library, so it runs in
  # globalization-invariant mode. Values reach perl through the environment, never re-parsed by
  # the shell.
  Default: >-
    if [ "${ACCEPT_EULA}" != "1" ]; then echo "Accept Northwood's EULA (https://link.scpslgame.com/eula) by setting Accept EULA to 1 in the panel's Startup tab."; exit 1; fi;
    CFG="/home/container/.config/SCP Secret Laboratory/config/{{SERVER_PORT}}/config_gameplay.txt";
    mkdir -p "$(dirname "${CFG}")"; touch "${CFG}";
    for k in server_name max_players; do grep -q "^${k}:" "${CFG}" || echo "${k}: x" >> "${CFG}"; done;
    perl -pi -e 's/^server_name:.*/server_name: $ENV{SERVER_NAME}/; s/^max_players:.*/max_players: $ENV{MAX_PLAYERS}/' "${CFG}";
    DOTNET_SYSTEM_GLOBALIZATION_INVARIANT=1 ./LocalAdmin {{SERVER_PORT}} --acceptEULA --useDefault --noSetCursor --noTerminalTitle --disableTrueColor
    --restartsLimit 0 {{EXTRA_ARGS}}
force_outgoing_ip: false
separate_port: false
config:
  files: {}
  startup:
    done:
      - "Waiting for players"
    strip_ansi: true
  stop:
    type: command
    value: exit
scripts:
  installation:
    container: ghcr.io/caloptreyx/installers:debian
    entrypoint: bash
    content: |
      #!/bin/bash
      # SCP: Secret Laboratory dedicated server installation script
      #
      # Server files: /mnt/server
      # Installer image: ghcr.io/caloptreyx/installers:debian

      SERVER_BINARY=/mnt/server/LocalAdmin

      # Calagopus Wings ignores the installer exit code and only marks the installation as failed when
      # a reason is written to INSTALL_STATUS_FILE. Pterodactyl Wings leaves it unset and uses the exit code.
      fail() {
          echo -e "\n[ERROR] $1\n"
          if [[ -n "${INSTALL_STATUS_FILE}" ]]; then
              echo "$1" > "${INSTALL_STATUS_FILE}"
          fi
          exit 1
      }

      ## download and install steamcmd
      cd /tmp || fail "cannot enter /tmp"
      mkdir -p /mnt/server/steamcmd /mnt/server/steamapps # steamapps: avoids a steamcmd disk write error
      curl -fsSL -o steamcmd.tar.gz https://steamcdn-a.akamaihd.net/client/installer/steamcmd_linux.tar.gz \
          || fail "could not download SteamCMD"
      tar -xzf steamcmd.tar.gz -C /mnt/server/steamcmd || fail "could not extract SteamCMD"
      cd /mnt/server/steamcmd || fail "cannot enter /mnt/server/steamcmd"

      # SteamCMD fails otherwise, even as root; ownership is fixed by the daemon after install.
      chown -R root:root /mnt
      export HOME=/mnt/server

      ## install the server; the first attempt often fails with "Missing configuration"
      for attempt in 1 2 3; do
          ./steamcmd.sh +force_install_dir /mnt/server +login anonymous \
              +app_update "${SRCDS_APPID}" $([[ -z "${SRCDS_BETAID}" ]] || printf %s "-beta ${SRCDS_BETAID}") validate \
              +quit && [[ -f "${SERVER_BINARY}" ]] && break
          echo "SteamCMD attempt ${attempt} failed, retrying..."
          sleep 5
      done
      [[ -f "${SERVER_BINARY}" ]] || fail "SteamCMD could not install app ${SRCDS_APPID}; check the install log and free disk space"

      ## steamclient libraries
      mkdir -p /mnt/server/.steam/sdk32 /mnt/server/.steam/sdk64
      cp -v linux32/steamclient.so /mnt/server/.steam/sdk32/steamclient.so
      cp -v linux64/steamclient.so /mnt/server/.steam/sdk64/steamclient.so

      chmod +x "${SERVER_BINARY}"
      mkdir -p "/mnt/server/.config/SCP Secret Laboratory"

      echo "-----------------------------------------"
      echo "Installation completed..."
      echo "-----------------------------------------"
variables:
  - name: Accept EULA
    description: >-
      The server only starts after you accept Northwood's End User License Agreement
      (https://link.scpslgame.com/eula): set to 1 to accept it.
    order: 1
    env_variable: ACCEPT_EULA
    default_value: "0"
    user_viewable: true
    user_editable: true
    rules: "required|in:0,1"
  - name: Server Name
    description: Name shown in the server list. Unity rich text tags such as <color=red>...</color> work.
    order: 2
    env_variable: SERVER_NAME
    default_value: SCP SL Server
    user_viewable: true
    user_editable: true
    rules: 'required|string|max:128|regex:/^[^\r\n]+$/'
  - name: Max Players
    description: Maximum number of players.
    order: 3
    env_variable: MAX_PLAYERS
    default_value: "20"
    user_viewable: true
    user_editable: true
    rules: "required|integer|between:1,100"
  - name: Extra Arguments
    description: Additional LocalAdmin arguments.
    order: 4
    env_variable: EXTRA_ARGS
    default_value: ""
    user_viewable: true
    user_editable: true
    rules: 'nullable|string|max:512|regex:/^[^\r\n]*$/'
  - name: Auto Update
    description: Update the server through SteamCMD on every start. (1 = on, 0 = off)
    order: 5
    env_variable: AUTO_UPDATE
    default_value: "1"
    user_viewable: true
    user_editable: true
    rules: "required|in:0,1"
  - name: Beta Branch
    description: Steam beta branch to install (e.g. public-beta). Leave empty for the stable release. Reinstall after changing it.
    order: 6
    env_variable: SRCDS_BETAID
    default_value: ""
    user_viewable: true
    user_editable: true
    rules: 'nullable|string|max:64|regex:/^[\w.-]*$/'
  - name: Steam App ID
    description: "Steam app id of the SCP: Secret Laboratory dedicated server."
    order: 7
    env_variable: SRCDS_APPID
    default_value: "996560"
    user_viewable: false
    user_editable: false
    rules: "required|string|in:996560"
