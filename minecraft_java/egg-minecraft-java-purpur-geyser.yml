name: "Minecraft: Java Edition (Purpur + Geyser + Floodgate)"
author: thexylo@pm.me
description: >-
  Purpur with the Geyser and Floodgate plugins: Minecraft: Java Edition and Bedrock Edition
  players (phones, consoles, Windows) play on the same server, Bedrock players without a Java
  account. Bedrock players need a second allocation (Bedrock Port, TCP and UDP).
features:
  - eula
  - java_version
docker_images:
  Java 25: ghcr.io/caloptreyx/java:25
  Java 21: ghcr.io/caloptreyx/java:21
  Java 17: ghcr.io/caloptreyx/java:17
file_denylist: []
startup_commands:
  # Java 17 sets user.home to "?" when the container user has no passwd entry, and Minecraft then
  # creates a "?" folder in the server root.
  Default: java -Xms128M -XX:MaxRAMPercentage=95.0 -Duser.home=/home/container -jar {{SERVER_JARFILE}} nogui
force_outgoing_ip: false
separate_port: false
config:
  files:
    server.properties:
      parser: properties
      replace:
        - match: server-ip
          replace_with: 0.0.0.0
        - match: server-port
          replace_with: "{{server.build.default.port}}"
        - match: enable-query
          replace_with: "true"
        - match: query.port
          replace_with: "{{server.build.default.port}}"
    plugins/Geyser-Spigot/config.yml:
      parser: yaml
      replace:
        - match: bedrock.port
          replace_with: "{{env.BEDROCK_PORT}}"
        - match: bedrock.address
          replace_with: 0.0.0.0
  startup:
    done:
      - ")! For help, type "
    strip_ansi: false
  stop:
    type: command
    value: stop
scripts:
  installation:
    container: ghcr.io/caloptreyx/installers:debian
    entrypoint: bash
    content: |
      #!/bin/bash
      # Minecraft: Java Edition (Purpur + Geyser + Floodgate) installation script
      #
      # Server files: /mnt/server
      # Installer image: ghcr.io/caloptreyx/installers:debian
      #
      # Installs Purpur and the newest Geyser and Floodgate builds for Spigot-based servers (also
      # updated on every reinstall).

      API="https://api.purpurmc.org/v2/purpur"
      GEYSER_API="https://download.geysermc.org/v2/projects"
      MANIFEST_URL="https://piston-meta.mojang.com/mc/game/version_manifest_v2.json"

      # Calagopus Wings ignores the installer exit code and only marks the installation as failed when
      # a reason is written to INSTALL_STATUS_FILE. Pterodactyl Wings leaves it unset and uses the exit code.
      fail() {
          echo -e "\n[ERROR] $1\n"
          if [[ -n "${INSTALL_STATUS_FILE}" ]]; then
              echo "$1" > "${INSTALL_STATUS_FILE}"
          fi
          exit 1
      }

      mkdir -p /mnt/server/plugins
      cd /mnt/server || fail "cannot enter /mnt/server"

      ## Purpur version: the newest one (the list is oldest first), or the one set in the panel
      versions=$(curl -fsSL --retry 3 "${API}") || fail "could not download the Purpur version list"
      if [[ -z "${MINECRAFT_VERSION}" || "${MINECRAFT_VERSION,,}" == "latest" ]]; then
          version=$(jq -r '.versions[-1]' <<< "${versions}")
      else
          version="${MINECRAFT_VERSION}"
          jq -e --arg v "${version}" '.versions | index($v)' <<< "${versions}" > /dev/null \
              || fail "Purpur has no version '${version}'"
      fi
      build=$(curl -fsSL --retry 3 "${API}/${version}/latest") || fail "Purpur ${version} has no builds"
      build_id=$(jq -r '.build' <<< "${build}")
      md5=$(jq -r '.md5 // empty' <<< "${build}")
      echo "Downloading Purpur ${version} build ${build_id}..."
      curl -fsSL --retry 3 -o "${SERVER_JARFILE}.download" "${API}/${version}/${build_id}/download" \
          || fail "could not download Purpur ${version} build ${build_id}"
      if [[ -n "${md5}" ]] && ! echo "${md5}  ${SERVER_JARFILE}.download" | md5sum -c --quiet -; then
          rm -f "${SERVER_JARFILE}.download"
          fail "the downloaded Purpur jar is corrupt (checksum mismatch)"
      fi
      mv -f "${SERVER_JARFILE}.download" "${SERVER_JARFILE}"

      ## Geyser and Floodgate (Spigot builds), checked against the SHA-256 the API lists
      for project in geyser floodgate; do
          info=$(curl -fsSL --retry 3 "${GEYSER_API}/${project}/versions/latest/builds/latest") || fail "could not look up the newest ${project} build"
          sha=$(jq -r '.downloads.spigot.sha256 // empty' <<< "${info}")
          [[ -n "${sha}" ]] || fail "the newest ${project} build has no Spigot download"
          echo "Downloading ${project} $(jq -r '.version' <<< "${info}") build $(jq -r '.build' <<< "${info}")..."
          curl -fsSL --retry 3 -o "plugins/${project}-spigot.jar.download" \
              "${GEYSER_API}/${project}/versions/$(jq -r '.version' <<< "${info}")/builds/$(jq -r '.build' <<< "${info}")/downloads/spigot" \
              || fail "could not download ${project}"
          echo "${sha}  plugins/${project}-spigot.jar.download" | sha256sum -c --quiet - \
              || { rm -f "plugins/${project}-spigot.jar.download"; fail "the ${project} download is corrupt (checksum mismatch)"; }
          mv -f "plugins/${project}-spigot.jar.download" "plugins/${project}-spigot.jar"
      done

      ## server.properties and Geyser's config.yml: the panel only replaces keys that exist, and both
      ## files are written on the first start, so the keys it sets are created here (the server and
      ## Geyser add the rest)
      if [[ ! -f server.properties ]]; then
          printf '%s\n' "server-ip=0.0.0.0" "server-port=25565" "enable-query=true" "query.port=25565" > server.properties
      fi
      if [[ ! -f plugins/Geyser-Spigot/config.yml ]]; then
          mkdir -p plugins/Geyser-Spigot
          printf '%s\n' "bedrock:" "  address: 0.0.0.0" "  port: 19132" > plugins/Geyser-Spigot/config.yml
      fi
      echo "purpur ${version} ${build_id}" > .server-version

      ## the Java version Mojang's metadata gives for this Minecraft version
      version_url=$(curl -fsSL --retry 3 "${MANIFEST_URL}" | jq -r --arg v "${version}" '.versions[] | select(.id == $v) | .url')
      java_version=$([[ -n "${version_url}" ]] && curl -fsSL --retry 3 "${version_url}" | jq -r '.javaVersion.majorVersion // empty')

      echo "-----------------------------------------"
      echo "Purpur ${version} build ${build_id} with Geyser and Floodgate installed. It needs Java ${java_version:-17} or newer:"
      echo "select the matching Java image in the server's Startup settings."
      echo "-----------------------------------------"
variables:
  - name: Minecraft Version
    description: >-
      latest for the newest version Purpur supports, or a version such as 1.21.10 (Geyser supports
      recent versions only). Reinstall the server to switch versions; worlds and plugins are kept.
    order: 1
    env_variable: MINECRAFT_VERSION
    default_value: latest
    user_viewable: true
    user_editable: true
    rules:
      - required
      - string
      - max:64
      - 'regex:/^[A-Za-z0-9._-]+$/'
  - name: Bedrock Port
    description: >-
      Port Bedrock players connect to. Needs its own allocation: Geyser's signaling uses it over
      TCP and NetherNet over UDP, so it cannot be the Java port.
    order: 2
    env_variable: BEDROCK_PORT
    default_value: "19132"
    user_viewable: true
    user_editable: false
    rules:
      - required
      - integer
      - between:1024,65535
  - name: Server Jar File
    description: Name of the server jar file.
    order: 3
    env_variable: SERVER_JARFILE
    default_value: server.jar
    user_viewable: true
    user_editable: true
    rules:
      - required
      - string
      - max:64
      - 'regex:/^[\w.-]+\.jar$/'
