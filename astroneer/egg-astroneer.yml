name: Astroneer
author: thexylo@pm.me
description: >-
  Explore and reshape distant worlds. The Windows-only Astroneer dedicated server (Steam app
  728470) runs through Proton.
features:
  - steam_disk_space
docker_images:
  Proton: ghcr.io/caloptreyx/steamcmd:proton
file_denylist: []
startup_commands:
  # The server's own output is unusable under Proton, so its log is streamed to the console. The
  # server reads no console input.
  Default: >-
    mkdir -p Astro/Saved/Logs; : > Astro/Saved/Logs/Astro.log;
    proton run ./Astro/Binaries/Win64/AstroServer-Win64-Shipping.exe -log & SRV=$!;
    tail -n +1 -F Astro/Saved/Logs/Astro.log --pid=${SRV} 2>/dev/null &
    wait ${SRV}
force_outgoing_ip: false
separate_port: false
config:
  files:
    Astro/Saved/Config/WindowsServer/Engine.ini:
      parser: ini
      replace:
        - match: URL.Port
          replace_with: "{{server.build.default.port}}"
        - match: SystemSettings.net.AllowEncryption
          replace_with: "{{env.ENCRYPTION}}"
    Astro/Saved/Config/WindowsServer/AstroServerSettings.ini:
      parser: ini
      replace:
        - match: "[/Script/Astro.AstroServerSettings].PublicIP"
          replace_with: "{{env.PUBLIC_IP}}"
        - match: "[/Script/Astro.AstroServerSettings].ServerName"
          replace_with: "{{env.SERVER_NAME}}"
        - match: "[/Script/Astro.AstroServerSettings].ServerPassword"
          replace_with: "{{env.SERVER_PASSWORD}}"
        - match: "[/Script/Astro.AstroServerSettings].OwnerName"
          replace_with: "{{env.OWNER_NAME}}"
        - match: "[/Script/Astro.AstroServerSettings].OwnerGuid"
          replace_with: "{{env.OWNER_GUID}}"
        - match: "[/Script/Astro.AstroServerSettings].PlayerProperties"
          replace_with: '(PlayerFirstJoinName="{{env.OWNER_NAME}}",PlayerCategory=Admin,PlayerGuid="{{env.OWNER_GUID}}",PlayerRecentJoinName="")'
        - match: "[/Script/Astro.AstroServerSettings].MaximumPlayerCount"
          replace_with: "{{env.MAX_PLAYERS}}"
  startup:
    done:
      - Dedicated server ready to start
    strip_ansi: false
  stop:
    type: signal
    value: SIGINT
scripts:
  installation:
    container: ghcr.io/caloptreyx/installers:debian
    entrypoint: bash
    content: |
      #!/bin/bash
      # Astroneer dedicated server installation script (Windows server, run through Proton)
      #
      # Server files: /mnt/server
      # Installer image: ghcr.io/caloptreyx/installers:debian

      SERVER_BINARY=/mnt/server/Astro/Binaries/Win64/AstroServer-Win64-Shipping.exe

      # Calagopus Wings ignores the installer exit code and only marks the installation as failed when
      # a reason is written to INSTALL_STATUS_FILE. Pterodactyl Wings leaves it unset and uses the exit code.
      fail() {
          echo -e "\n[ERROR] $1\n"
          if [[ -n "${INSTALL_STATUS_FILE}" ]]; then
              echo "$1" > "${INSTALL_STATUS_FILE}"
          fi
          exit 1
      }

      ## download and install steamcmd
      cd /tmp || fail "cannot enter /tmp"
      mkdir -p /mnt/server/steamcmd /mnt/server/steamapps # steamapps: avoids a steamcmd disk write error
      curl -fsSL -o steamcmd.tar.gz https://steamcdn-a.akamaihd.net/client/installer/steamcmd_linux.tar.gz \
          || fail "could not download SteamCMD"
      tar -xzf steamcmd.tar.gz -C /mnt/server/steamcmd || fail "could not extract SteamCMD"
      cd /mnt/server/steamcmd || fail "cannot enter /mnt/server/steamcmd"

      # SteamCMD fails otherwise, even as root; ownership is fixed by the daemon after install.
      chown -R root:root /mnt
      export HOME=/mnt/server

      ## install the Windows server; the first attempt often fails with "Missing configuration"
      for attempt in 1 2 3; do
          ./steamcmd.sh +force_install_dir /mnt/server +@sSteamCmdForcePlatformType windows +login anonymous \
              +app_update "${SRCDS_APPID}" validate +quit && [[ -f "${SERVER_BINARY}" ]] && break
          echo "SteamCMD attempt ${attempt} failed, retrying..."
          sleep 5
      done
      [[ -f "${SERVER_BINARY}" ]] || fail "SteamCMD could not install app ${SRCDS_APPID}; check the install log and free disk space"

      ## steamclient libraries
      mkdir -p /mnt/server/.steam/sdk32 /mnt/server/.steam/sdk64
      cp -v linux32/steamclient.so /mnt/server/.steam/sdk32/steamclient.so
      cp -v linux64/steamclient.so /mnt/server/.steam/sdk64/steamclient.so

      mkdir -p /mnt/server/Astro/Saved/Config/WindowsServer /mnt/server/Astro/Saved/Logs

      echo "-----------------------------------------"
      echo "Installation completed..."
      echo "-----------------------------------------"
variables:
  - name: Server Name
    description: Name shown to players.
    order: 1
    env_variable: SERVER_NAME
    default_value: Astroneer Server
    user_viewable: true
    user_editable: true
    rules: "required|string|max:60"
  - name: Public IP
    description: >-
      The server's public IP address. Required: Astroneer registers this address, and players
      connect to it.
    order: 2
    env_variable: PUBLIC_IP
    default_value: ""
    user_viewable: true
    user_editable: true
    rules: "required|ip"
  - name: Owner Name
    description: Steam name of the server owner, who gets owner rights. Cannot contain double quotes.
    order: 3
    env_variable: OWNER_NAME
    default_value: ""
    user_viewable: true
    user_editable: true
    rules: 'required|string|max:64|regex:/^[^"]+$/'
  - name: Owner Steam ID
    description: >-
      64-bit Steam ID of the server owner (17 digits, e.g. from steamid.io). Required together with
      Owner Name, or the server stops on start.
    order: 4
    env_variable: OWNER_GUID
    default_value: ""
    user_viewable: true
    user_editable: true
    rules: 'required|string|regex:/^\d{17}$/'
  - name: Server Password
    description: Password players need to join. Leave empty for no password.
    order: 5
    env_variable: SERVER_PASSWORD
    default_value: ""
    user_viewable: true
    user_editable: true
    secret: true
    rules: "nullable|string|max:64"
  - name: Max Players
    description: Maximum number of players.
    order: 6
    env_variable: MAX_PLAYERS
    default_value: "8"
    user_viewable: true
    user_editable: true
    rules: "required|integer|between:1,8"
  - name: Network Encryption
    description: >-
      Encrypt game traffic. Must be False for players to connect to a server running through Proton
      (see the README).
    order: 7
    env_variable: ENCRYPTION
    default_value: "False"
    user_viewable: true
    user_editable: false
    rules: "required|in:True,False"
  - name: Auto Update
    description: Update the server through SteamCMD on every start. (1 = on, 0 = off)
    order: 8
    env_variable: AUTO_UPDATE
    default_value: "1"
    user_viewable: true
    user_editable: true
    rules: "required|in:0,1"
  - name: Steam App ID
    description: Steam app id of the Astroneer dedicated server.
    order: 9
    env_variable: SRCDS_APPID
    default_value: "728470"
    user_viewable: false
    user_editable: false
    rules: "required|string|in:728470"
  - name: Windows Install
    description: The server is Windows-only; auto updates must download the Windows files.
    order: 10
    env_variable: WINDOWS_INSTALL
    default_value: "1"
    user_viewable: false
    user_editable: false
    rules: "required|in:1"
