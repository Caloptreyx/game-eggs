name: Horizon
author: thexylo@pm.me
description: >-
  Horizon's native Minecraft: Java Edition 26.3 server (horizon-server): Horizon's own Rust engine
  instead of Java, with vanilla's settings, worlds and commands. Vanilla 26.3 clients and Horizon
  clients can join. Horizon is installed and updated on start, and its game files are prepared from
  Mojang's 26.3 client and server.
features:
  - eula
docker_images:
  Horizon: ghcr.io/caloptreyx/games:horizon
file_denylist: []
startup_commands:
  # The image installs or updates Horizon, prepares the game files and writes the settings below
  # into server.toml before this runs (see the README).
  Default: exec ./horizon/horizon-server run
force_outgoing_ip: false
separate_port: false
config:
  files: {}
  startup:
    done:
      - ")! For help, type "
    strip_ansi: false
  stop:
    type: command
    value: stop
scripts:
  installation:
    container: ghcr.io/caloptreyx/installers:debian
    entrypoint: bash
    content: |
      #!/bin/bash
      # Horizon (Minecraft: Java Edition 26.3) installation script
      #
      # Server files: /mnt/server
      # Installer image: ghcr.io/caloptreyx/installers:debian
      #
      # horizon-server is downloaded and its game files prepared on start, by horizon-update in
      # ghcr.io/caloptreyx/games:horizon. A reinstall makes the next start download and prepare
      # again; worlds and settings are kept.

      mkdir -p /mnt/server
      cd /mnt/server || exit 1
      rm -f horizon/.horizon-release horizon/.local/horizon-client/.horizon-prepared

      echo "-----------------------------------------"
      echo "Installed. The first start downloads Horizon and prepares the game files,"
      echo "which takes a few minutes and about 1 GB of memory."
      echo "-----------------------------------------"
variables:
  - name: Horizon Version
    description: >-
      latest for the current Horizon Nightly (the only build Horizon ships), or a release tag such
      as v0.2.97 or nightly-2026-10-29. A changed version is installed on the next start.
    order: 1
    env_variable: HORIZON_VERSION
    default_value: latest
    user_viewable: true
    user_editable: true
    rules: 'required|string|max:64|regex:/^[A-Za-z0-9._-]+$/'
  - name: Auto Update
    description: >-
      1 checks for a new build of Horizon Version on every start and installs it (the game files
      are prepared again, a few minutes). 0 keeps the installed build. (1 = on, 0 = off)
    order: 2
    env_variable: AUTO_UPDATE
    default_value: "1"
    user_viewable: true
    user_editable: true
    rules: "required|in:0,1"
  - name: Prepare Game Files
    description: >-
      1 prepares the game files Horizon reads from Mojang's Minecraft 26.3 client and server. 0
      skips it: upload a folder prepared with Horizon's launcher or horizon-prepare as resources/
      instead.
    order: 3
    env_variable: PREPARE_GAME_FILES
    default_value: "1"
    user_viewable: true
    user_editable: true
    rules: "required|in:0,1"
  - name: Online Mode
    description: >-
      true checks players' Minecraft accounts. false lets anyone join under any name, which Horizon's
      own client needs (it cannot sign in to Microsoft accounts yet); keep the whitelist on then.
      Empty keeps server.toml's value.
    order: 4
    env_variable: ONLINE_MODE
    default_value: ""
    user_viewable: true
    user_editable: true
    rules: "nullable|in:true,false"
  - name: Whitelist
    description: >-
      true lets in only whitelisted players and operators (Horizon's default). Empty keeps
      server.toml's value.
    order: 5
    env_variable: WHITELIST
    default_value: ""
    user_viewable: true
    user_editable: true
    rules: "nullable|in:true,false"
  - name: Whitelisted Players
    description: >-
      Names added to the whitelist on every start, separated by commas. Remove a name here too
      when you take it off the whitelist.
    order: 6
    env_variable: WHITELIST_PLAYERS
    default_value: ""
    user_viewable: true
    user_editable: true
    rules: 'nullable|string|max:1024|regex:/^[A-Za-z0-9_, ]*$/'
  - name: Operators
    description: >-
      Names made operators on every start, separated by commas. Remove a name here too when you
      deop it.
    order: 7
    env_variable: OPS
    default_value: ""
    user_viewable: true
    user_editable: true
    rules: 'nullable|string|max:1024|regex:/^[A-Za-z0-9_, ]*$/'
  - name: MOTD
    description: The line under the server's name in the server list. Empty keeps server.toml's value.
    order: 8
    env_variable: MOTD
    default_value: ""
    user_viewable: true
    user_editable: true
    rules: "nullable|string|max:256"
  - name: Max Players
    description: How many players can be online at once (1 to 1000). Empty keeps server.toml's value.
    order: 9
    env_variable: MAX_PLAYERS
    default_value: ""
    user_viewable: true
    user_editable: true
    rules: "nullable|integer|between:1,1000"
  - name: Game Mode
    description: The default game mode. Empty keeps server.toml's value.
    order: 10
    env_variable: GAME_MODE
    default_value: ""
    user_viewable: true
    user_editable: true
    rules: "nullable|in:survival,creative,adventure,spectator"
  - name: Difficulty
    description: The world's difficulty. Empty keeps server.toml's value.
    order: 11
    env_variable: DIFFICULTY
    default_value: ""
    user_viewable: true
    user_editable: true
    rules: "nullable|in:peaceful,easy,normal,hard"
  - name: View Distance
    description: Chunks sent around each player (2 to 32). Empty keeps server.toml's value.
    order: 12
    env_variable: VIEW_DISTANCE
    default_value: ""
    user_viewable: true
    user_editable: true
    rules: "nullable|integer|between:2,32"
  - name: Horizon Backups
    description: >-
      How often Horizon zips the world into backups/ while the server runs (30m, 6h, 1d...; it keeps
      the last 12). 0 turns them off: Calagopus backups cover the world, and Horizon's use the
      server's disk. Empty keeps server.toml's value.
    order: 13
    env_variable: BACKUP_INTERVAL
    default_value: "0"
    user_viewable: true
    user_editable: true
    rules: 'nullable|string|max:16|regex:/^(0|[1-9][0-9]*[mhd])$/'
  - name: Pregeneration
    description: >-
      true enables Horizon's pregen console command, which generates the world around spawn ahead
      of the players (pregen start 2500). Empty keeps server.toml's value.
    order: 14
    env_variable: PREGEN
    default_value: ""
    user_viewable: true
    user_editable: true
    rules: "nullable|in:true,false"
