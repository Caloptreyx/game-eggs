name: Longvinter
author: thexylo@pm.me
description: >-
  Longvinter, the cozy-looking open-world sandbox with crafting, fishing, farming, building,
  trading and PvP on a shared island. Native Linux dedicated server (Steam app 1639880), listed
  through Epic Online Services.
features:
  - steam_disk_space
docker_images:
  SteamCMD Debian: ghcr.io/caloptreyx/steamcmd:debian
file_denylist: []
startup_commands:
  # Name, MOTD, website, tag, password, player limit, admins, PvP, tents, hardcore and the daily
  # restart are written to Longvinter/Saved/Config/LinuxServer/Game.ini on every start (created
  # once from the shipped Game.ini.default); other settings in it stay yours. The game's public EOS
  # dedicated server credentials ship in Saved/Config/LinuxServer/Engine.ini, which the server
  # deletes when it exits, so they are passed as launch arguments. The server reads no console
  # input; the stop signal (SIGINT) shuts it down.
  Default: >-
    ./Longvinter/Binaries/Linux/LongvinterServer-Linux-Shipping Longvinter -Port={{SERVER_PORT}} -log
    -ini:Engine:[EpicOnlineServices]:DedicatedServerDistributionMode=DevelopersAndPlayers
    -ini:Engine:[EpicOnlineServices]:DedicatedServerClientId=xyza7891CkjSybtzm7jyxk4OHHIjrndG
    -ini:Engine:[EpicOnlineServices]:DedicatedServerClientSecret=SZ7/Ef5FQv2OxQqpeV6j5nCiuyBC2txG26Q+ZnDnN2s
force_outgoing_ip: false
separate_port: false
config:
  files:
    Longvinter/Saved/Config/LinuxServer/Game.ini:
      parser: file
      replace:
        - match: "ServerName="
          replace_with: "ServerName={{env.SERVER_NAME}}"
        - match: "ServerMOTD="
          replace_with: "ServerMOTD={{env.SERVER_MOTD}}"
        - match: "CommunityWebsite="
          replace_with: "CommunityWebsite={{env.COMMUNITY_WEBSITE}}"
        - match: "Tag="
          replace_with: "Tag={{env.SERVER_TAG}}"
        - match: "MaxPlayers="
          replace_with: "MaxPlayers={{env.MAX_PLAYERS}}"
        - match: "Password="
          replace_with: "Password={{env.SERVER_PASSWORD}}"
        - match: "AdminSteamID="
          replace_with: "AdminSteamID={{env.ADMIN_IDS}}"
        - match: "PVP="
          replace_with: "PVP={{env.PVP}}"
        - match: "TentDecay="
          replace_with: "TentDecay={{env.TENT_DECAY}}"
        - match: "MaxTents="
          replace_with: "MaxTents={{env.MAX_TENTS}}"
        - match: "Hardcore="
          replace_with: "Hardcore={{env.HARDCORE}}"
        - match: "RestartTime24h="
          replace_with: "RestartTime24h={{env.RESTART_HOUR}}"
  startup:
    done:
      - "Successfully updated session"
    strip_ansi: true
  stop:
    type: signal
    value: SIGINT
scripts:
  installation:
    container: ghcr.io/caloptreyx/installers:debian
    entrypoint: bash
    content: |
      #!/bin/bash
      # Longvinter dedicated server installation script (native Linux build)
      #
      # Server files: /mnt/server
      # Installer image: ghcr.io/caloptreyx/installers:debian

      SERVER_BINARY=/mnt/server/Longvinter/Binaries/Linux/LongvinterServer-Linux-Shipping

      # Calagopus Wings ignores the installer exit code and only marks the installation as failed when
      # a reason is written to INSTALL_STATUS_FILE. Pterodactyl Wings leaves it unset and uses the exit code.
      fail() {
          echo -e "\n[ERROR] $1\n"
          if [[ -n "${INSTALL_STATUS_FILE}" ]]; then
              echo "$1" > "${INSTALL_STATUS_FILE}"
          fi
          exit 1
      }

      ## download and install steamcmd
      cd /tmp || fail "cannot enter /tmp"
      mkdir -p /mnt/server/steamcmd /mnt/server/steamapps # steamapps: avoids a steamcmd disk write error
      curl -fsSL -o steamcmd.tar.gz https://steamcdn-a.akamaihd.net/client/installer/steamcmd_linux.tar.gz \
          || fail "could not download SteamCMD"
      tar -xzf steamcmd.tar.gz -C /mnt/server/steamcmd || fail "could not extract SteamCMD"
      cd /mnt/server/steamcmd || fail "cannot enter /mnt/server/steamcmd"

      # SteamCMD fails otherwise, even as root; ownership is fixed by the daemon after install.
      chown -R root:root /mnt
      export HOME=/mnt/server

      ## install the game; downloads occasionally abort with a steamcmd state error
      for attempt in 1 2 3; do
          ./steamcmd.sh +force_install_dir /mnt/server +login anonymous \
              +app_update "${SRCDS_APPID}" validate +quit && [[ -f "${SERVER_BINARY}" ]] && break
          echo "SteamCMD attempt ${attempt} failed, retrying..."
          sleep 5
      done
      [[ -f "${SERVER_BINARY}" ]] || fail "SteamCMD could not install app ${SRCDS_APPID}; check the install log and free disk space"

      ## steamclient libraries
      mkdir -p /mnt/server/.steam/sdk32 /mnt/server/.steam/sdk64
      cp -v linux32/steamclient.so /mnt/server/.steam/sdk32/steamclient.so
      cp -v linux64/steamclient.so /mnt/server/.steam/sdk64/steamclient.so

      chmod +x "${SERVER_BINARY}"

      ## Game.ini: created once from the shipped Game.ini.default
      CONFIG_DIR=/mnt/server/Longvinter/Saved/Config/LinuxServer
      if [[ ! -f "${CONFIG_DIR}/Game.ini" ]]; then
          cp "${CONFIG_DIR}/Game.ini.default" "${CONFIG_DIR}/Game.ini" || fail "the server has no Game.ini.default"
      fi

      echo "-----------------------------------------"
      echo "Installation completed..."
      echo "-----------------------------------------"
variables:
  - name: Server Name
    description: Name shown in the server browser. Avoid the word OFFICIAL.
    order: 1
    env_variable: SERVER_NAME
    default_value: Unnamed Island
    user_viewable: true
    user_editable: true
    rules: 'required|string|max:64|regex:/^[^\r\n]+$/'
  - name: Server MOTD
    description: Message of the day, shown on signs around the island.
    order: 2
    env_variable: SERVER_MOTD
    default_value: Welcome to Longvinter Island!
    user_viewable: true
    user_editable: true
    rules: 'required|string|max:256|regex:/^[^\r\n]+$/'
  - name: Community Website
    description: Website promoted with the server message.
    order: 3
    env_variable: COMMUNITY_WEBSITE
    default_value: www.longvinter.com
    user_viewable: true
    user_editable: true
    rules: 'nullable|string|max:128|regex:/^[^\s]*$/'
  - name: Server Tag
    description: One tag for server searches (for example PVE), or none.
    order: 4
    env_variable: SERVER_TAG
    default_value: none
    user_viewable: true
    user_editable: true
    rules: 'required|string|max:32|regex:/^\w+$/'
  - name: Server Password
    description: Password players need to join (letters and numbers only). Leave empty for no password.
    order: 5
    env_variable: SERVER_PASSWORD
    default_value: ""
    user_viewable: true
    user_editable: true
    secret: true
    rules: 'nullable|string|max:64|regex:/^[A-Za-z0-9]*$/'
  - name: Max Players
    description: Maximum number of players.
    order: 6
    env_variable: MAX_PLAYERS
    default_value: "32"
    user_viewable: true
    user_editable: true
    rules: "required|integer|between:1,100"
  - name: Admin EOS IDs
    description: EOS IDs (shown in the game settings) of the admins, separated by single spaces.
    order: 7
    env_variable: ADMIN_IDS
    default_value: ""
    user_viewable: true
    user_editable: true
    rules: 'nullable|string|max:512|regex:/^[0-9a-f ]*$/'
  - name: PvP
    description: Allow player versus player damage and raiding. (true or false)
    order: 8
    env_variable: PVP
    default_value: "true"
    user_viewable: true
    user_editable: true
    rules: "required|in:true,false"
  - name: Tent Decay
    description: Abandoned tents decay. (true or false)
    order: 9
    env_variable: TENT_DECAY
    default_value: "true"
    user_viewable: true
    user_editable: true
    rules: "required|in:true,false"
  - name: Max Tents
    description: Houses a player can place without prestige.
    order: 10
    env_variable: MAX_TENTS
    default_value: "3"
    user_viewable: true
    user_editable: true
    rules: "required|integer|between:1,20"
  - name: Hardcore
    description: Hardcore mode (no house codes, destructible turrets). (true or false)
    order: 11
    env_variable: HARDCORE
    default_value: "false"
    user_viewable: true
    user_editable: true
    rules: "required|in:true,false"
  - name: Daily Restart Hour
    description: Hour (0-23, server time) of the server's own daily restart.
    order: 12
    env_variable: RESTART_HOUR
    default_value: "6"
    user_viewable: true
    user_editable: true
    rules: "required|integer|between:0,23"
  - name: Auto Update
    description: Update the server through SteamCMD on every start. (1 = on, 0 = off)
    order: 13
    env_variable: AUTO_UPDATE
    default_value: "1"
    user_viewable: true
    user_editable: true
    rules: "required|in:0,1"
  - name: Steam App ID
    description: Steam app id of the Longvinter dedicated server.
    order: 14
    env_variable: SRCDS_APPID
    default_value: "1639880"
    user_viewable: false
    user_editable: false
    rules: "required|string|in:1639880"
