name: Onset
author: thexylo@pm.me
description: >-
  Onset, the open-world multiplayer sandbox on Unreal Engine 4 where servers build their own game
  modes (roleplay, cops and robbers, freeroam) with Lua packages. Native Linux dedicated server
  (Steam app 1204170).
features:
  - steam_disk_space
docker_images:
  SteamCMD Debian: ghcr.io/caloptreyx/steamcmd:debian
file_denylist: []
startup_commands:
  # The server reads server_config.json; name, player limit, password, port and the master list
  # setting are written into it on every start, the packages, plugins and pools stay yours. It
  # needs OpenSSL 1.1 (installed into .libssl11) and its own libraries from the server root and
  # linux64/. The query port (UDP, game port - 1) and file port (TCP, game port - 2) need their own
  # allocations. The server reads no console input; the stop signal (SIGINT) shuts it down.
  Default: >-
    export LD_LIBRARY_PATH="/home/container:/home/container/linux64:/home/container/.libssl11:${LD_LIBRARY_PATH}";
    ./OnsetServer --noinput
force_outgoing_ip: false
separate_port: false
config:
  files:
    server_config.json:
      parser: json
      create_new: false
      replace:
        - match: servername
          replace_with: '"{{env.SERVER_NAME}}"'
        - match: servername_short
          replace_with: '"{{env.SERVER_NAME_SHORT}}"'
        - match: gamemode
          replace_with: '"{{env.GAMEMODE}}"'
        - match: ipaddress
          replace_with: '"0.0.0.0"'
        - match: port
          replace_with: "{{server.build.default.port}}"
        - match: maxplayers
          replace_with: "{{env.MAX_PLAYERS}}"
        - match: password
          replace_with: '"{{env.SERVER_PASSWORD}}"'
        - match: masterlist
          replace_with: "{{env.MASTERLIST}}"
  startup:
    done:
      - "Entering simulation"
    strip_ansi: true
  stop:
    type: signal
    value: SIGINT
scripts:
  installation:
    container: ghcr.io/caloptreyx/installers:debian
    entrypoint: bash
    content: |
      #!/bin/bash
      # Onset dedicated server installation script (native Linux build)
      #
      # Server files: /mnt/server
      # Installer image: ghcr.io/caloptreyx/installers:debian

      SERVER_BINARY=/mnt/server/OnsetServer

      # Calagopus Wings ignores the installer exit code and only marks the installation as failed when
      # a reason is written to INSTALL_STATUS_FILE. Pterodactyl Wings leaves it unset and uses the exit code.
      fail() {
          echo -e "\n[ERROR] $1\n"
          if [[ -n "${INSTALL_STATUS_FILE}" ]]; then
              echo "$1" > "${INSTALL_STATUS_FILE}"
          fi
          exit 1
      }

      ## download and install steamcmd
      cd /tmp || fail "cannot enter /tmp"
      mkdir -p /mnt/server/steamcmd /mnt/server/steamapps # steamapps: avoids a steamcmd disk write error
      curl -fsSL -o steamcmd.tar.gz https://steamcdn-a.akamaihd.net/client/installer/steamcmd_linux.tar.gz \
          || fail "could not download SteamCMD"
      tar -xzf steamcmd.tar.gz -C /mnt/server/steamcmd || fail "could not extract SteamCMD"
      cd /mnt/server/steamcmd || fail "cannot enter /mnt/server/steamcmd"

      # SteamCMD fails otherwise, even as root; ownership is fixed by the daemon after install.
      chown -R root:root /mnt
      export HOME=/mnt/server

      ## install the game; downloads occasionally abort with a steamcmd state error
      for attempt in 1 2 3; do
          ./steamcmd.sh +force_install_dir /mnt/server +login anonymous \
              +app_update "${SRCDS_APPID}" validate +quit && [[ -f "${SERVER_BINARY}" ]] && break
          echo "SteamCMD attempt ${attempt} failed, retrying..."
          sleep 5
      done
      [[ -f "${SERVER_BINARY}" ]] || fail "SteamCMD could not install app ${SRCDS_APPID}; check the install log and free disk space"

      ## steamclient libraries
      mkdir -p /mnt/server/.steam/sdk32 /mnt/server/.steam/sdk64
      cp -v linux32/steamclient.so /mnt/server/.steam/sdk32/steamclient.so
      cp -v linux64/steamclient.so /mnt/server/.steam/sdk64/steamclient.so

      chmod +x "${SERVER_BINARY}"

      ## OpenSSL 1.1 for the server (Debian 11's package; Debian 13 only has OpenSSL 3)
      SSL_DEB=libssl1.1_1.1.1w-0+deb11u1_amd64.deb
      curl -fsSL --retry 3 -o /tmp/libssl11.deb "http://deb.debian.org/debian/pool/main/o/openssl/${SSL_DEB}" \
          || fail "could not download ${SSL_DEB}"
      rm -rf /tmp/libssl11 /mnt/server/.libssl11 && dpkg-deb -x /tmp/libssl11.deb /tmp/libssl11 || fail "could not extract ${SSL_DEB}"
      mkdir -p /mnt/server/.libssl11
      cp -a /tmp/libssl11/usr/lib/x86_64-linux-gnu/lib{ssl,crypto}.so.1.1 /mnt/server/.libssl11/ || fail "could not install OpenSSL 1.1"

      echo "-----------------------------------------"
      echo "Installation completed..."
      echo "-----------------------------------------"
variables:
  - name: Server Name
    description: Name shown in the server list.
    order: 1
    env_variable: SERVER_NAME
    default_value: Onset Server
    user_viewable: true
    user_editable: true
    rules:
      - required
      - string
      - max:64
      - 'regex:/^[^"\\\r\n]+$/'
  - name: Short Server Name
    description: Short name shown in the game.
    order: 2
    env_variable: SERVER_NAME_SHORT
    default_value: Onset Server
    user_viewable: true
    user_editable: true
    rules:
      - required
      - string
      - max:32
      - 'regex:/^[^"\\\r\n]+$/'
  - name: Game Mode
    description: Game mode text shown in the server list.
    order: 3
    env_variable: GAMEMODE
    default_value: do what you want
    user_viewable: true
    user_editable: true
    rules:
      - required
      - string
      - max:64
      - 'regex:/^[^"\\\r\n]+$/'
  - name: Server Password
    description: Password players need to join. Leave empty for no password.
    order: 4
    env_variable: SERVER_PASSWORD
    default_value: ""
    user_viewable: true
    user_editable: true
    secret: true
    rules:
      - nullable
      - string
      - max:64
      - 'regex:/^[^"\\\s]*$/'
  - name: Max Players
    description: Maximum number of players.
    order: 5
    env_variable: MAX_PLAYERS
    default_value: "100"
    user_viewable: true
    user_editable: true
    rules:
      - required
      - integer
      - between:1,1000
  - name: Master List
    description: Announce the server to the Onset master list. (true or false)
    order: 6
    env_variable: MASTERLIST
    default_value: "false"
    user_viewable: true
    user_editable: true
    rules:
      - required
      - in:true,false
  - name: Auto Update
    description: Update the server through SteamCMD on every start. (1 = on, 0 = off)
    order: 7
    env_variable: AUTO_UPDATE
    default_value: "1"
    user_viewable: true
    user_editable: true
    rules:
      - required
      - in:0,1
  - name: Steam App ID
    description: Steam app id of the Onset dedicated server.
    order: 8
    env_variable: SRCDS_APPID
    default_value: "1204170"
    user_viewable: false
    user_editable: false
    rules:
      - required
      - string
      - in:1204170
