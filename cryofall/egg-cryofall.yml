name: CryoFall
author: thexylo@pm.me
description: >-
  CryoFall, the sci-fi multiplayer survival and colony game: build, research, craft and trade on
  a hostile planet with other players. Linux dedicated server (Steam app 1061710) with the .NET
  runtime it needs.
features:
  - steam_disk_space
docker_images:
  SteamCMD Debian: ghcr.io/caloptreyx/steamcmd:debian
file_denylist: []
startup_commands:
  # The server is a .NET program (globalization-invariant); the installer puts the .NET runtime its
  # runtimeconfig asks for into .dotnet/. It loads the world (or creates one) on start. The console
  # takes server commands; stopping sends "stop 10", which saves and shuts down. The server starts
  # its script compiler as "dotnet ...", so .dotnet/ is on the PATH; the compiler needs
  # globalization-invariant mode too (the image has no ICU library).
  Default: >-
    ulimit -c 0; export DOTNET_ROOT=/home/container/.dotnet PATH="/home/container/.dotnet:${PATH}" DOTNET_CLI_TELEMETRY_OPTOUT=1 DOTNET_SYSTEM_GLOBALIZATION_INVARIANT=1;
    ./.dotnet/dotnet Binaries/Server/CryoFall_Server.dll loadOrNew
force_outgoing_ip: false
separate_port: false
config:
  files:
    Data/SettingsServer.xml:
      parser: xml
      create_new: false
      replace:
        - match: network.port
          replace_with: "{{server.build.default.port}}"
        - match: network.is_public_server
          replace_with: "{{env.PUBLIC}}"
        - match: server.name
          replace_with: "{{env.SERVER_NAME}}"
        - match: server.description
          replace_with: "{{env.SERVER_DESCRIPTION}}"
  startup:
    done:
      - "Socket-server listening on"
    strip_ansi: true
  stop:
    type: command
    value: stop 10
scripts:
  installation:
    container: ghcr.io/caloptreyx/installers:debian
    entrypoint: bash
    content: |
      #!/bin/bash
      # CryoFall dedicated server installation script
      #
      # Server files: /mnt/server
      # Installer image: ghcr.io/caloptreyx/installers:debian

      SERVER_BINARY=/mnt/server/Binaries/Server/CryoFall_Server.dll

      # Calagopus Wings ignores the installer exit code and only marks the installation as failed when
      # a reason is written to INSTALL_STATUS_FILE. Pterodactyl Wings leaves it unset and uses the exit code.
      fail() {
          echo -e "\n[ERROR] $1\n"
          if [[ -n "${INSTALL_STATUS_FILE}" ]]; then
              echo "$1" > "${INSTALL_STATUS_FILE}"
          fi
          exit 1
      }

      ## download and install steamcmd
      cd /tmp || fail "cannot enter /tmp"
      mkdir -p /mnt/server/steamcmd /mnt/server/steamapps # steamapps: avoids a steamcmd disk write error
      curl -fsSL -o steamcmd.tar.gz https://steamcdn-a.akamaihd.net/client/installer/steamcmd_linux.tar.gz \
          || fail "could not download SteamCMD"
      tar -xzf steamcmd.tar.gz -C /mnt/server/steamcmd || fail "could not extract SteamCMD"
      cd /mnt/server/steamcmd || fail "cannot enter /mnt/server/steamcmd"

      # SteamCMD fails otherwise, even as root; ownership is fixed by the daemon after install.
      chown -R root:root /mnt
      export HOME=/mnt/server

      for attempt in 1 2 3; do
          ./steamcmd.sh +force_install_dir /mnt/server +login anonymous \
              +app_update "${SRCDS_APPID}" validate +quit && [[ -f "${SERVER_BINARY}" ]] && break
          echo "SteamCMD attempt ${attempt} failed, retrying..."
          sleep 5
      done
      [[ -f "${SERVER_BINARY}" ]] || fail "SteamCMD could not install app ${SRCDS_APPID}; check the install log and free disk space"

      ## .NET runtime: the version the server's runtimeconfig asks for (latest patch of that channel)
      export TMPDIR=/mnt/server/.install-tmp
      rm -rf "${TMPDIR}" && mkdir -p "${TMPDIR}"
      dotnet_version=$(jq -r '.runtimeOptions.framework.version // empty' /mnt/server/Binaries/Server/CryoFall_Server.runtimeconfig.json)
      dotnet_channel=$(cut -d. -f1,2 <<< "${dotnet_version}")
      [[ "${dotnet_channel}" =~ ^[0-9]+\.[0-9]+$ ]] || fail "could not read the .NET version the server needs"
      echo "Installing the .NET ${dotnet_channel} runtime..."
      curl -fsSL --retry 3 -o "${TMPDIR}/dotnet-install.sh" https://dot.net/v1/dotnet-install.sh || fail "could not download the .NET install script"
      rm -rf /mnt/server/.dotnet
      bash "${TMPDIR}/dotnet-install.sh" --channel "${dotnet_channel}" --runtime dotnet --install-dir /mnt/server/.dotnet --no-path >/dev/null \
          || fail "could not install the .NET ${dotnet_channel} runtime"
      rm -rf "${TMPDIR}"

      ## Data/SettingsServer.xml: seeded once with the settings the panel manages; the server adds
      ## every other setting (with its documentation) on its first start
      mkdir -p /mnt/server/Data
      if [[ ! -f /mnt/server/Data/SettingsServer.xml ]]; then
          cat > /mnt/server/Data/SettingsServer.xml << 'EOF'
      <?xml version="1.0" encoding="utf-8" standalone="yes"?>
      <settings version="20">
        <network>
          <port>6000</port>
          <is_public_server>0</is_public_server>
        </network>
        <server>
          <name>CryoFall Server</name>
          <description>CryoFall server</description>
        </server>
      </settings>
      EOF
      fi
      echo "-----------------------------------------"
      echo "Installation completed..."
      echo "-----------------------------------------"
variables:
  - name: Auto Update
    description: Update the server through SteamCMD on every start. (1 = on, 0 = off)
    order: 1
    env_variable: AUTO_UPDATE
    default_value: "1"
    user_viewable: true
    user_editable: true
    rules: "required|in:0,1"
  - name: Steam App ID
    description: Steam app id of the CryoFall dedicated server.
    order: 2
    env_variable: SRCDS_APPID
    default_value: "1061710"
    user_viewable: false
    user_editable: false
    rules: "required|string|in:1061710"
  - name: Server Name
    description: Name shown in the server list.
    order: 3
    env_variable: SERVER_NAME
    default_value: CryoFall Server
    user_viewable: true
    user_editable: true
    rules: 'required|string|max:64|regex:/^[^<>&\r\n]+$/'
  - name: Server Description
    description: Short description shown in the server list.
    order: 4
    env_variable: SERVER_DESCRIPTION
    default_value: CryoFall server
    user_viewable: true
    user_editable: true
    rules: 'nullable|string|max:600|regex:/^[^<>&\r\n]*$/'
  - name: Public
    description: List the server in the public server list. (1 = on, 0 = off)
    order: 5
    env_variable: PUBLIC
    default_value: "1"
    user_viewable: true
    user_editable: true
    rules: "required|in:0,1"
