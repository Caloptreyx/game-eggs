name: Soulmask
author: thexylo@pm.me
description: >-
  Escape a sacrificial ritual, find an ancient mystical mask, rally followers and build your own
  tribe in this open world survival game. Native Linux dedicated server (Steam app 3017300); no
  Wine needed.
features:
  - steam_disk_space
docker_images:
  SteamCMD Debian: ghcr.io/caloptreyx/steamcmd:debian
file_denylist: []
startup_commands:
  # The server logs to stdout, including the responses to console commands. Console lines go to the
  # server's local telnet (echo) port through one session, reconnected if it drops, so the paged
  # help keeps working; the telnet output is discarded because the server already logs it. The stop
  # signal reaches the whole process group, so the shell ignores it and waits for the server to
  # finish saving before the container exits. Values are expanded inside quotes, never re-parsed by
  # the shell. Keep "} }" spaced: "}}" is a placeholder delimiter for the image.
  Default: >-
    LD_LIBRARY_PATH=/home/container/linux64 ./WS/Binaries/Linux/WSServer-Linux-Shipping WS "${SERVER_MAP}"
    -server -log -UTF8Output -forcepassthrough -MULTIHOME=0.0.0.0
    -Port={{SERVER_PORT}} -QueryPort={{QUERY_PORT}} -EchoPort={{ECHO_PORT}}
    "-SteamServerName=${SERVER_NAME}" -MaxPlayers={{MAX_PLAYERS}}
    ${SERVER_PASSWORD:+"-PSW=${SERVER_PASSWORD}"} "-adminpsw=${ADMIN_PASSWORD}"
    -{{GAME_MODE}} -serverid={{SERVER_ID}} -saving={{SAVE_INTERVAL}} -backup={{BACKUP_INTERVAL}}
    $( case "${CLUSTER_ROLE}" in main) printf %s "-mainserverport=${CLUSTER_PORT}";;
    client) printf %s "-clientserverconnect=${CLUSTER_MAIN_ADDRESS}";; esac )
    ${RCON_PASSWORD:+"-rconpsw=${RCON_PASSWORD}" -rconaddr=0.0.0.0 "-rconport=${RCON_PORT}"}
    {{EXTRA_ARGS}} </dev/null & SRV=$!; trap "" INT;
    ( while kill -0 ${SRV} 2>/dev/null; do telnet -E 127.0.0.1 {{ECHO_PORT}} >/dev/null 2>&1; sleep 2; done ) <&0 &
    wait ${SRV}
force_outgoing_ip: false
separate_port: false
config:
  files: {}
  startup:
    done:
      - "[ GAME STARTED. ]"
    strip_ansi: false
  stop:
    type: signal
    value: SIGINT
scripts:
  installation:
    container: ghcr.io/caloptreyx/installers:debian
    entrypoint: bash
    content: |
      #!/bin/bash
      # Soulmask dedicated server installation script (native Linux build)
      #
      # Server files: /mnt/server
      # Installer image: ghcr.io/caloptreyx/installers:debian

      SERVER_BINARY=/mnt/server/WS/Binaries/Linux/WSServer-Linux-Shipping

      # Calagopus Wings ignores the installer exit code and only marks the installation as failed when
      # a reason is written to INSTALL_STATUS_FILE. Pterodactyl Wings leaves it unset and uses the exit code.
      fail() {
          echo -e "\n[ERROR] $1\n"
          if [[ -n "${INSTALL_STATUS_FILE}" ]]; then
              echo "$1" > "${INSTALL_STATUS_FILE}"
          fi
          exit 1
      }

      ## download and install steamcmd
      cd /tmp || fail "cannot enter /tmp"
      mkdir -p /mnt/server/steamcmd /mnt/server/steamapps # steamapps: avoids a steamcmd disk write error
      curl -fsSL -o steamcmd.tar.gz https://steamcdn-a.akamaihd.net/client/installer/steamcmd_linux.tar.gz \
          || fail "could not download SteamCMD"
      tar -xzf steamcmd.tar.gz -C /mnt/server/steamcmd || fail "could not extract SteamCMD"
      cd /mnt/server/steamcmd || fail "cannot enter /mnt/server/steamcmd"

      # SteamCMD fails otherwise, even as root; ownership is fixed by the daemon after install.
      chown -R root:root /mnt
      export HOME=/mnt/server

      ## install the game; large downloads occasionally abort with a steamcmd state error
      for attempt in 1 2 3; do
          ./steamcmd.sh +force_install_dir /mnt/server +login anonymous \
              +app_update "${SRCDS_APPID}" $([[ -z "${SRCDS_BETAID}" ]] || printf %s "-beta ${SRCDS_BETAID}") validate \
              +quit && [[ -f "${SERVER_BINARY}" ]] && break
          echo "SteamCMD attempt ${attempt} failed, retrying..."
          sleep 5
      done
      [[ -f "${SERVER_BINARY}" ]] || fail "SteamCMD could not install app ${SRCDS_APPID}; check the install log and free disk space"

      ## steamclient libraries
      mkdir -p /mnt/server/.steam/sdk32 /mnt/server/.steam/sdk64
      cp -v linux32/steamclient.so /mnt/server/.steam/sdk32/steamclient.so
      cp -v linux64/steamclient.so /mnt/server/.steam/sdk64/steamclient.so

      chmod +x "${SERVER_BINARY}"

      echo "-----------------------------------------"
      echo "Installation completed..."
      echo "-----------------------------------------"
variables:
  - name: Server Name
    description: Name shown in the server list. Cannot contain ".
    order: 1
    env_variable: SERVER_NAME
    default_value: A Soulmask Server
    user_viewable: true
    user_editable: true
    rules: 'required|string|max:64|regex:/^[^"]+$/'
  - name: Server Password
    description: Password players need to join. Leave empty for no password. No spaces or ".
    order: 2
    env_variable: SERVER_PASSWORD
    default_value: ""
    user_viewable: true
    user_editable: true
    secret: true
    rules: 'nullable|string|max:32|regex:/^[^"\s]*$/'
  - name: Admin Password
    description: >-
      Password to open the admin (GM) panel in game with the console command "gm key <password>".
      No spaces or ".
    order: 3
    env_variable: ADMIN_PASSWORD
    default_value: ""
    user_viewable: true
    user_editable: true
    secret: true
    rules: 'required|string|max:32|regex:/^[^"\s]+$/'
  - name: Map
    description: Map to host. Level01_Main = Cloud Mist Forest, DLC_Level01_Main = Shifting Sands.
    order: 4
    env_variable: SERVER_MAP
    default_value: Level01_Main
    user_viewable: true
    user_editable: true
    rules: "required|in:Level01_Main,DLC_Level01_Main"
  - name: Max Players
    description: Maximum number of players on the server.
    order: 5
    env_variable: MAX_PLAYERS
    default_value: "50"
    user_viewable: true
    user_editable: true
    rules: "required|integer|between:1,70"
  - name: Game Mode
    description: pve or pvp. Applies the matching preset to the gameplay settings on start.
    order: 6
    env_variable: GAME_MODE
    default_value: pve
    user_viewable: true
    user_editable: true
    rules: "required|in:pve,pvp"
  - name: Save Interval
    description: Seconds between saves of the world state to the in-memory database.
    order: 7
    env_variable: SAVE_INTERVAL
    default_value: "600"
    user_viewable: true
    user_editable: true
    rules: "required|integer|between:60,3600"
  - name: Disk Write Interval
    description: Seconds between writes of the in-memory database to world.db on disk.
    order: 8
    env_variable: BACKUP_INTERVAL
    default_value: "900"
    user_viewable: true
    user_editable: true
    rules: "required|integer|between:60,3600"
  - name: Server ID
    description: >-
      Numeric server id, unique within a cluster. Player characters are tied to it: changing it
      after players have joined makes them start over.
    order: 9
    env_variable: SERVER_ID
    default_value: "1"
    user_viewable: true
    user_editable: true
    rules: "required|integer|between:0,9999"
  - name: Cluster Role
    description: >-
      none for a standalone server, main for the server that holds the player accounts of a
      cluster, client for the other servers of a cluster. Changing it on an existing world changes
      where player data is stored (see the README).
    order: 10
    env_variable: CLUSTER_ROLE
    default_value: none
    user_viewable: true
    user_editable: true
    rules: "required|in:none,main,client"
  - name: Cluster Port
    description: >-
      Main server only: TCP port the client servers connect to. Needs its own allocation reachable
      by the client servers; keep it closed to the public.
    order: 11
    env_variable: CLUSTER_PORT
    default_value: "20000"
    user_viewable: true
    user_editable: false
    rules: "required|integer|between:1024,65535"
  - name: Cluster Main Address
    description: Client servers only, as ip:port of the main server's Cluster Port, e.g. 10.0.0.5:20000.
    order: 12
    env_variable: CLUSTER_MAIN_ADDRESS
    default_value: ""
    user_viewable: true
    user_editable: true
    rules: 'nullable|string|max:128|regex:/^[\w.-]+:\d{1,5}$/'
  - name: Query Port
    description: UDP port for the Steam server list. Needs its own allocation.
    order: 13
    env_variable: QUERY_PORT
    default_value: "27015"
    user_viewable: true
    user_editable: false
    rules: "required|integer|between:1024,65535"
  - name: Echo Port
    description: >-
      Local telnet port the panel console uses. It only listens inside the container and needs no
      allocation.
    order: 14
    env_variable: ECHO_PORT
    default_value: "18888"
    user_viewable: true
    user_editable: false
    rules: "required|integer|between:1024,65535"
  - name: RCON Password
    description: Enables RCON for remote admin tools. Leave empty to keep RCON off. No spaces or ".
    order: 15
    env_variable: RCON_PASSWORD
    default_value: ""
    user_viewable: true
    user_editable: true
    secret: true
    rules: 'nullable|string|max:64|regex:/^[^"\s]*$/'
  - name: RCON Port
    description: TCP port for RCON. Needs its own allocation when RCON is enabled.
    order: 16
    env_variable: RCON_PORT
    default_value: "19000"
    user_viewable: true
    user_editable: false
    rules: "required|integer|between:1024,65535"
  - name: Extra Arguments
    description: Additional launch parameters, e.g. -initbackup -backupinterval=60 -GongHuiMaxMember=10
    order: 17
    env_variable: EXTRA_ARGS
    default_value: ""
    user_viewable: true
    user_editable: true
    rules: "nullable|string|max:512"
  - name: Auto Update
    description: Update the server through SteamCMD on every start. (1 = on, 0 = off)
    order: 18
    env_variable: AUTO_UPDATE
    default_value: "1"
    user_viewable: true
    user_editable: true
    rules: "required|in:0,1"
  - name: Beta Branch
    description: Steam beta branch to install. Leave empty for the stable release. Reinstall after changing it.
    order: 19
    env_variable: SRCDS_BETAID
    default_value: ""
    user_viewable: true
    user_editable: true
    rules: 'nullable|string|max:64|regex:/^[\w.-]*$/'
  - name: Steam App ID
    description: Steam app id of the Soulmask Linux dedicated server.
    order: 20
    env_variable: SRCDS_APPID
    default_value: "3017300"
    user_viewable: false
    user_editable: false
    rules: "required|string|in:3017300"
