name: "Empyrion: Galactic Survival"
author: thexylo@pm.me
description: >-
  Empyrion: Galactic Survival, the open-world space survival sandbox: build ships and bases, explore
  planets, fight and trade across a galaxy, together. The Windows-only dedicated server (Steam app
  530870) runs through Proton.
features:
  - steam_disk_space
docker_images:
  Proton: ghcr.io/caloptreyx/steamcmd:proton
file_denylist: []
startup_commands:
  # Port, name, description, visibility, password, player limit, game name, mode, seed, scenario
  # and anti-cheat are written to dedicated.yaml on every start (the installer adds the keys the
  # shipped file only has as comments). The server needs a display (Xvfb). Its log is streamed from
  # Logs/server/server.log. Console lines are forwarded to the server's local telnet console (bash
  # /dev/tcp), and its answers are printed. A signal kills the server without saving, so it runs in
  # its own session and the shell catches the stop signal (SIGINT): it sends "saveandexit 0" over
  # telnet, which saves the game and exits.
  Default: >-
    mkdir -p Logs/server; rm -f Logs/server/server.log; touch Logs/server/server.log; cd DedicatedServer;
    setsid xvfb-run -a proton run ./EmpyrionDedicated.exe -batchmode -nographics -logFile ../Logs/server/server.log >/dev/null 2>&1 & SRV=$!;
    tail -n +1 -F ../Logs/server/server.log --pid=${SRV} 2>/dev/null &
    until (exec 5<>/dev/tcp/127.0.0.1/{{TELNET_PORT}}) 2>/dev/null; do kill -0 ${SRV} 2>/dev/null || break; sleep 2; done;
    exec 5<>/dev/tcp/127.0.0.1/{{TELNET_PORT}} && { cat <&5 & };
    trap 'echo "Saving the game and stopping..."; printf "saveandexit 0\r\n" >&5' INT TERM;
    while IFS= read -r line; do printf "%s\r\n" "${line}" >&5; done <&0 &
    while kill -0 ${SRV} 2>/dev/null; do wait ${SRV}; done
force_outgoing_ip: false
separate_port: false
config:
  files:
    dedicated.yaml:
      parser: yaml
      replace:
        - match: ServerConfig.Srv_Port
          replace_with: "{{server.build.default.port}}"
        - match: ServerConfig.Srv_Name
          replace_with: "{{env.SERVER_NAME}}"
        - match: ServerConfig.Srv_Description
          replace_with: "{{env.SERVER_DESCRIPTION}}"
        - match: ServerConfig.Srv_Public
          replace_with: "{{env.PUBLIC}}"
        - match: ServerConfig.Srv_Password
          replace_with: "{{env.SERVER_PASSWORD}}"
        - match: ServerConfig.Srv_MaxPlayers
          replace_with: "{{env.MAX_PLAYERS}}"
        - match: ServerConfig.Tel_Enabled
          replace_with: "true"
        - match: ServerConfig.Tel_Port
          replace_with: "{{env.TELNET_PORT}}"
        - match: ServerConfig.EACActive
          replace_with: "{{env.EAC_ACTIVE}}"
        - match: GameConfig.GameName
          replace_with: "{{env.GAME_NAME}}"
        - match: GameConfig.Mode
          replace_with: "{{env.GAME_MODE}}"
        - match: GameConfig.Seed
          replace_with: "{{env.GAME_SEED}}"
        - match: GameConfig.CustomScenario
          replace_with: "{{env.SCENARIO}}"
  startup:
    done:
      - "Server started listening on port"
    strip_ansi: true
  stop:
    type: signal
    value: SIGINT
scripts:
  installation:
    container: ghcr.io/caloptreyx/installers:debian
    entrypoint: bash
    content: |
      #!/bin/bash
      # Empyrion: Galactic Survival dedicated server installation script (Windows server, run through Proton)
      #
      # Server files: /mnt/server
      # Installer image: ghcr.io/caloptreyx/installers:debian

      SERVER_BINARY=/mnt/server/DedicatedServer/EmpyrionDedicated.exe

      # Calagopus Wings ignores the installer exit code and only marks the installation as failed when
      # a reason is written to INSTALL_STATUS_FILE. Pterodactyl Wings leaves it unset and uses the exit code.
      fail() {
          echo -e "\n[ERROR] $1\n"
          if [[ -n "${INSTALL_STATUS_FILE}" ]]; then
              echo "$1" > "${INSTALL_STATUS_FILE}"
          fi
          exit 1
      }

      ## download and install steamcmd
      cd /tmp || fail "cannot enter /tmp"
      mkdir -p /mnt/server/steamcmd /mnt/server/steamapps # steamapps: avoids a steamcmd disk write error
      curl -fsSL -o steamcmd.tar.gz https://steamcdn-a.akamaihd.net/client/installer/steamcmd_linux.tar.gz \
          || fail "could not download SteamCMD"
      tar -xzf steamcmd.tar.gz -C /mnt/server/steamcmd || fail "could not extract SteamCMD"
      cd /mnt/server/steamcmd || fail "cannot enter /mnt/server/steamcmd"

      # SteamCMD fails otherwise, even as root; ownership is fixed by the daemon after install.
      chown -R root:root /mnt
      export HOME=/mnt/server

      for attempt in 1 2 3; do
          ./steamcmd.sh +force_install_dir /mnt/server +@sSteamCmdForcePlatformType windows +login anonymous \
              +app_update "${SRCDS_APPID}" validate +quit && [[ -f "${SERVER_BINARY}" ]] && break
          echo "SteamCMD attempt ${attempt} failed, retrying..."
          sleep 5
      done
      [[ -f "${SERVER_BINARY}" ]] || fail "SteamCMD could not install app ${SRCDS_APPID}; check the install log and free disk space"

      ## steamclient libraries
      mkdir -p /mnt/server/.steam/sdk32 /mnt/server/.steam/sdk64
      cp -v linux32/steamclient.so /mnt/server/.steam/sdk32/steamclient.so
      cp -v linux64/steamclient.so /mnt/server/.steam/sdk64/steamclient.so

      ## dedicated.yaml: the shipped file has password, player limit, description and the telnet
      ## console only as comments; they are added once after Srv_Name so the panel can set them.
      ## (The panel's YAML parser later rewrites the file with two-space indentation.)
      cd /mnt/server || fail "cannot enter /mnt/server"
      [[ -f dedicated.yaml ]] || fail "the server has no dedicated.yaml"
      if ! grep -qE '^[[:space:]]+Tel_Port:' dedicated.yaml; then
          sed -i 's/^\([[:space:]]*\)\(Srv_Name: .*\)$/\1\2\n\1Srv_Description: ""\n\1Srv_Password: ""\n\1Srv_MaxPlayers: 8\n\1Tel_Enabled: true\n\1Tel_Port: 30010\n\1Tel_Pwd: ""/' dedicated.yaml
          grep -qE '^[[:space:]]+Tel_Port:' dedicated.yaml || fail "could not add the panel keys to dedicated.yaml"
      fi

      echo "-----------------------------------------"
      echo "Installation completed..."
      echo "-----------------------------------------"
variables:
  - name: Server Name
    description: Name shown in the server browser.
    order: 1
    env_variable: SERVER_NAME
    default_value: Empyrion Server
    user_viewable: true
    user_editable: true
    rules: 'required|string|max:64|regex:/^[^"#:\r\n]+$/'
  - name: Server Description
    description: Description shown in the server browser.
    order: 2
    env_variable: SERVER_DESCRIPTION
    default_value: ""
    user_viewable: true
    user_editable: true
    rules: 'nullable|string|max:128|regex:/^[^"#:\r\n]*$/'
  - name: Server Password
    description: Password players need to join. Leave empty for no password.
    order: 3
    env_variable: SERVER_PASSWORD
    default_value: ""
    user_viewable: true
    user_editable: true
    secret: true
    rules: 'nullable|string|max:64|regex:/^[A-Za-z0-9_-]*$/'
  - name: Max Players
    description: Maximum number of players.
    order: 4
    env_variable: MAX_PLAYERS
    default_value: "8"
    user_viewable: true
    user_editable: true
    rules: "required|integer|between:1,100"
  - name: Public
    description: List the server in the server browser. (true or false)
    order: 5
    env_variable: PUBLIC
    default_value: "true"
    user_viewable: true
    user_editable: true
    rules: "required|in:true,false"
  - name: Game Name
    description: Name of the save game (folder in Saves/Games/); a new name starts a new game.
    order: 6
    env_variable: GAME_NAME
    default_value: DediGame
    user_viewable: true
    user_editable: true
    rules: 'required|string|max:32|regex:/^[\w-]+$/'
  - name: Game Mode
    description: Survival or Creative (new games only).
    order: 7
    env_variable: GAME_MODE
    default_value: Survival
    user_viewable: true
    user_editable: true
    rules: "required|in:Survival,Creative"
  - name: Seed
    description: Seed of a new game.
    order: 8
    env_variable: GAME_SEED
    default_value: "1011345"
    user_viewable: true
    user_editable: true
    rules: "required|integer|between:0,2147483647"
  - name: Scenario
    description: Scenario of a new game (folder name in Content/Scenarios).
    order: 9
    env_variable: SCENARIO
    default_value: Default Multiplayer
    user_viewable: true
    user_editable: true
    rules: 'required|string|max:64|regex:/^[\w .-]+$/'
  - name: EasyAntiCheat
    description: Enable EasyAntiCheat. (true or false)
    order: 10
    env_variable: EAC_ACTIVE
    default_value: "true"
    user_viewable: true
    user_editable: true
    rules: "required|in:true,false"
  - name: Telnet Port
    description: Local port of the server's telnet console (used by the panel console and stop; not exposed).
    order: 11
    env_variable: TELNET_PORT
    default_value: "30010"
    user_viewable: true
    user_editable: false
    rules: "required|integer|between:1024,65535"
  - name: Auto Update
    description: Update the server through SteamCMD on every start. (1 = on, 0 = off)
    order: 12
    env_variable: AUTO_UPDATE
    default_value: "1"
    user_viewable: true
    user_editable: true
    rules: "required|in:0,1"
  - name: Windows Install
    description: Download the Windows build through SteamCMD.
    order: 13
    env_variable: WINDOWS_INSTALL
    default_value: "1"
    user_viewable: false
    user_editable: false
    rules: "required|in:1"
  - name: Steam App ID
    description: Steam app id of the Empyrion dedicated server.
    order: 14
    env_variable: SRCDS_APPID
    default_value: "530870"
    user_viewable: false
    user_editable: false
    rules: "required|string|in:530870"
