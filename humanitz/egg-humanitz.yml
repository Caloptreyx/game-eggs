name: HumanitZ
author: thexylo@pm.me
description: >-
  Open world zombie survival: scavenge, build and survive alone or with friends. Native Linux
  dedicated server (Steam app 2728330, linuxbranch) with RCON console; no Wine needed.
features:
  - steam_disk_space
docker_images:
  SteamCMD Debian: ghcr.io/caloptreyx/steamcmd:debian
file_denylist: []
startup_commands:
  # The server log is printed to the console (-log). Console lines are sent to the server over RCON
  # once it is up (the server reads no console input itself). The server exits on SIGINT without
  # saving, so it runs in its own session, out of reach of the stop signal: the shell traps the
  # signal, asks the server to save over RCON, waits until the world save file is rewritten (at
  # most 60 seconds), then forwards SIGINT and waits for the server to exit. The RCON reply to save
  # arrives late, so it is not waited for. Values are expanded inside quotes, never re-parsed by the
  # shell.
  Default: >-
    setsid ./HumanitZServer/Binaries/Linux/HumanitZServer-Linux-Shipping HumanitZServer -log
    -port={{SERVER_PORT}} -queryport={{QUERY_PORT}} -steamservername="${SERVER_NAME}" {{EXTRA_ARGS}} & SRV=$!;
    trap 'touch /tmp/stop-request; echo "Stop requested: saving the world...";
    rcon -a "127.0.0.1:${RCON_PORT}" -p "${RCON_PASSWORD}" save >/dev/null 2>&1 & END=$((SECONDS + 60));
    until [ -n "$(find HumanitZServer/Saved/SaveGames/SaveList -name "Save_*.sav" -newer /tmp/stop-request 2>/dev/null)" ]
    || [ ${SECONDS} -ge ${END} ] || ! kill -0 ${SRV} 2>/dev/null; do sleep 1; done; sleep 2; kill -INT ${SRV} 2>/dev/null' INT;
    (while read -r line; do rcon -a "127.0.0.1:${RCON_PORT}" -p "${RCON_PASSWORD}" "${line}"; done) <&0 &
    while kill -0 ${SRV} 2>/dev/null; do wait ${SRV}; done
force_outgoing_ip: false
separate_port: false
config:
  files:
    HumanitZServer/GameServerSettings.ini:
      parser: ini
      replace:
        - match: "[Host Settings].ServerName"
          replace_with: '"{{env.SERVER_NAME}}"'
        - match: "[Host Settings].Password"
          replace_with: '"{{env.SERVER_PASSWORD}}"'
        - match: "[Host Settings].SaveName"
          replace_with: '"{{env.SAVE_NAME}}"'
        - match: "[Host Settings].SearchID"
          replace_with: '"{{env.SEARCH_ID}}"'
        - match: "[Host Settings].AdminPass"
          replace_with: '"{{env.ADMIN_PASSWORD}}"'
        - match: "[Host Settings].MaxPlayers"
          replace_with: "{{env.MAX_PLAYERS}}"
        - match: "[Host Settings].RCONEnabled"
          replace_with: "true"
        - match: "[Host Settings].RConPort"
          replace_with: "{{env.RCON_PORT}}"
        - match: "[Host Settings].RCONPass"
          replace_with: '"{{env.RCON_PASSWORD}}"'
        - match: "[World Settings].PVP"
          replace_with: "{{env.PVP}}"
        - match: "[World Settings].SaveIntervalSec"
          replace_with: "{{env.SAVE_INTERVAL}}"
  startup:
    done:
      - "Success => Session created!"
    strip_ansi: false
  stop:
    type: signal
    value: SIGINT
scripts:
  installation:
    container: ghcr.io/caloptreyx/installers:debian
    entrypoint: bash
    content: |
      #!/bin/bash
      # HumanitZ dedicated server installation script (native Linux build, Steam branch linuxbranch)
      #
      # Server files: /mnt/server
      # Installer image: ghcr.io/caloptreyx/installers:debian

      SERVER_BINARY=/mnt/server/HumanitZServer/Binaries/Linux/HumanitZServer-Linux-Shipping

      # Calagopus Wings ignores the installer exit code and only marks the installation as failed when
      # a reason is written to INSTALL_STATUS_FILE. Pterodactyl Wings leaves it unset and uses the exit code.
      fail() {
          echo -e "\n[ERROR] $1\n"
          if [[ -n "${INSTALL_STATUS_FILE}" ]]; then
              echo "$1" > "${INSTALL_STATUS_FILE}"
          fi
          exit 1
      }

      ## download and install steamcmd
      cd /tmp || fail "cannot enter /tmp"
      mkdir -p /mnt/server/steamcmd /mnt/server/steamapps # steamapps: avoids a steamcmd disk write error
      curl -fsSL -o steamcmd.tar.gz https://steamcdn-a.akamaihd.net/client/installer/steamcmd_linux.tar.gz \
          || fail "could not download SteamCMD"
      tar -xzf steamcmd.tar.gz -C /mnt/server/steamcmd || fail "could not extract SteamCMD"
      cd /mnt/server/steamcmd || fail "cannot enter /mnt/server/steamcmd"

      # SteamCMD fails otherwise, even as root; ownership is fixed by the daemon after install.
      chown -R root:root /mnt
      export HOME=/mnt/server

      ## install the server; the public branch holds the Windows build, the Linux build is on
      ## linuxbranch (SRCDS_BETAID). The first attempt often fails with "Missing configuration".
      for attempt in 1 2 3; do
          ./steamcmd.sh +force_install_dir /mnt/server +login anonymous \
              +app_update "${SRCDS_APPID}" -beta "${SRCDS_BETAID}" validate +quit \
              && [[ -f "${SERVER_BINARY}" ]] && break
          echo "SteamCMD attempt ${attempt} failed, retrying..."
          sleep 5
      done
      [[ -f "${SERVER_BINARY}" ]] || fail "SteamCMD could not install app ${SRCDS_APPID}; check the install log and free disk space"

      ## steamclient libraries
      mkdir -p /mnt/server/.steam/sdk32 /mnt/server/.steam/sdk64
      cp -v linux32/steamclient.so /mnt/server/.steam/sdk32/steamclient.so
      cp -v linux64/steamclient.so /mnt/server/.steam/sdk64/steamclient.so

      chmod +x "${SERVER_BINARY}"

      ## the server creates GameServerSettings.ini from the same defaults on its first start; creating
      ## it now lets the panel settings apply from the first start on
      if [[ ! -f /mnt/server/HumanitZServer/GameServerSettings.ini ]]; then
          cp -v /mnt/server/HumanitZServer/REF_GameServerSettings.ini /mnt/server/HumanitZServer/GameServerSettings.ini \
              || fail "REF_GameServerSettings.ini is missing from the server files"
      fi

      echo "-----------------------------------------"
      echo "Installation completed..."
      echo "-----------------------------------------"
variables:
  - name: Server Name
    description: >-
      Name shown in the server list. Avoid the word "Official", or the server may not start or not
      be listed. Cannot contain double quotes.
    order: 1
    env_variable: SERVER_NAME
    default_value: HumanitZ Server
    user_viewable: true
    user_editable: true
    rules: 'required|string|max:64|regex:/^[^"]+$/'
  - name: Server Password
    description: Password players need to join. Leave empty for no password. Cannot contain double quotes.
    order: 2
    env_variable: SERVER_PASSWORD
    default_value: ""
    user_viewable: true
    user_editable: true
    secret: true
    rules: 'nullable|string|max:64|regex:/^[^"]*$/'
  - name: Admin Password
    description: >-
      Players get admin rights in game with /AdminAccess <password>. Leave empty to turn this off.
      Cannot contain double quotes.
    order: 3
    env_variable: ADMIN_PASSWORD
    default_value: ""
    user_viewable: true
    user_editable: true
    secret: true
    rules: 'nullable|string|max:64|regex:/^[^"]*$/'
  - name: Max Players
    description: Maximum number of players.
    order: 4
    env_variable: MAX_PLAYERS
    default_value: "16"
    user_viewable: true
    user_editable: true
    rules: "required|integer|between:1,64"
  - name: Save Name
    description: >-
      Name of the world save. A new name starts a new world; the old one is kept in
      HumanitZServer/Saved/SaveGames/SaveList/Default/.
    order: 5
    env_variable: SAVE_NAME
    default_value: DedicatedSaveMP
    user_viewable: true
    user_editable: true
    rules: 'required|string|max:64|regex:/^[\w-]+$/'
  - name: Search ID
    description: >-
      Server list pool. HumanitZ_Dedicated is the public list; with any other ID players only find the
      server by searching for that ID.
    order: 6
    env_variable: SEARCH_ID
    default_value: HumanitZ_Dedicated
    user_viewable: true
    user_editable: true
    rules: 'required|string|max:64|regex:/^[\w-]+$/'
  - name: PvP
    description: Players can damage each other and each other's cars and containers.
    order: 7
    env_variable: PVP
    default_value: "true"
    user_viewable: true
    user_editable: true
    rules: "required|in:true,false"
  - name: Save Interval
    description: Seconds between automatic world saves. 0 turns them off.
    order: 8
    env_variable: SAVE_INTERVAL
    default_value: "300"
    user_viewable: true
    user_editable: true
    rules: "required|integer|between:0,86400"
  - name: Query Port
    description: UDP port for the Steam server list. Needs its own allocation.
    order: 9
    env_variable: QUERY_PORT
    default_value: "27015"
    user_viewable: true
    user_editable: false
    rules: "required|integer|between:1024,65535"
  - name: RCON Port
    description: >-
      TCP port for RCON. The panel console uses it locally; it needs its own allocation only for
      remote admin tools.
    order: 10
    env_variable: RCON_PORT
    default_value: "8888"
    user_viewable: true
    user_editable: false
    rules: "required|integer|between:1024,65535"
  - name: RCON Password
    description: RCON password, also used by the panel console. No spaces or double quotes.
    order: 11
    env_variable: RCON_PASSWORD
    default_value: ""
    user_viewable: true
    user_editable: true
    secret: true
    rules: 'required|string|min:3|max:64|regex:/^[^\s"]+$/'
  - name: Extra Arguments
    description: Additional server launch parameters.
    order: 12
    env_variable: EXTRA_ARGS
    default_value: ""
    user_viewable: true
    user_editable: true
    rules: "nullable|string|max:512"
  - name: Auto Update
    description: Update the server through SteamCMD on every start. (1 = on, 0 = off)
    order: 13
    env_variable: AUTO_UPDATE
    default_value: "1"
    user_viewable: true
    user_editable: true
    rules: "required|in:0,1"
  - name: Steam App ID
    description: Steam app id of the HumanitZ dedicated server.
    order: 14
    env_variable: SRCDS_APPID
    default_value: "2728330"
    user_viewable: false
    user_editable: false
    rules: "required|string|in:2728330"
  - name: Steam Branch
    description: The native Linux server is only on the linuxbranch branch; the public branch is the Windows build.
    order: 15
    env_variable: SRCDS_BETAID
    default_value: linuxbranch
    user_viewable: false
    user_editable: false
    rules: "required|string|in:linuxbranch"
