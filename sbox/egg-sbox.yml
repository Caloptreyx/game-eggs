name: s&box
author: thexylo@pm.me
description: >-
  Facepunch's game platform: the dedicated server runs any s&box game package with an optional
  map. Native Linux dedicated server (Steam app 1892930), bundled .NET runtime; no Wine needed.
features:
  - steam_disk_space
docker_images:
  SteamCMD Debian: ghcr.io/caloptreyx/steamcmd:debian
file_denylist: []
startup_commands:
  # The server only takes console input through an interactive overlay that needs a sized terminal,
  # which the panel console is not (it crashes on Enter there), so its output goes through a pipe,
  # which turns the overlay off: the server reads no console input. cat runs in its own session so
  # the stop signal does not cut the output short. Steam needs the SteamCMD client library in
  # ~/.steam/sdk64, which the installer puts there. The server has no shutdown handling of its own:
  # SIGINT ends it at once.
  Default: >-
    ./sbox-server +game "${GAME}" ${MAP:+"${MAP}"} +hostname "${SERVER_NAME}"
    +port {{SERVER_PORT}} +net_query_port {{QUERY_PORT}} +net_hide_address {{STEAM_RELAY}}
    ${GAME_SERVER_TOKEN:++net_game_server_token} ${GAME_SERVER_TOKEN:+"${GAME_SERVER_TOKEN}"}
    {{EXTRA_ARGS}} 2>&1 | setsid cat
force_outgoing_ip: false
separate_port: false
config:
  files: {}
  startup:
    done:
      - "game.load success"
    strip_ansi: false
  stop:
    type: signal
    value: SIGINT
scripts:
  installation:
    container: ghcr.io/caloptreyx/installers:debian
    entrypoint: bash
    content: |
      #!/bin/bash
      # s&box dedicated server installation script (native Linux build)
      #
      # Server files: /mnt/server
      # Installer image: ghcr.io/caloptreyx/installers:debian

      SERVER_BINARY=/mnt/server/sbox-server

      # Calagopus Wings ignores the installer exit code and only marks the installation as failed when
      # a reason is written to INSTALL_STATUS_FILE. Pterodactyl Wings leaves it unset and uses the exit code.
      fail() {
          echo -e "\n[ERROR] $1\n"
          if [[ -n "${INSTALL_STATUS_FILE}" ]]; then
              echo "$1" > "${INSTALL_STATUS_FILE}"
          fi
          exit 1
      }

      ## download and install steamcmd
      cd /tmp || fail "cannot enter /tmp"
      mkdir -p /mnt/server/steamcmd /mnt/server/steamapps # steamapps: avoids a steamcmd disk write error
      curl -fsSL -o steamcmd.tar.gz https://steamcdn-a.akamaihd.net/client/installer/steamcmd_linux.tar.gz \
          || fail "could not download SteamCMD"
      tar -xzf steamcmd.tar.gz -C /mnt/server/steamcmd || fail "could not extract SteamCMD"
      cd /mnt/server/steamcmd || fail "cannot enter /mnt/server/steamcmd"

      # SteamCMD fails otherwise, even as root; ownership is fixed by the daemon after install.
      chown -R root:root /mnt
      export HOME=/mnt/server

      ## install the server; the first attempt often fails with "Missing configuration"
      for attempt in 1 2 3; do
          ./steamcmd.sh +force_install_dir /mnt/server +login anonymous \
              +app_update "${SRCDS_APPID}" $([[ -z "${SRCDS_BETAID}" ]] || printf %s "-beta ${SRCDS_BETAID}") validate \
              +quit && [[ -f "${SERVER_BINARY}" ]] && break
          echo "SteamCMD attempt ${attempt} failed, retrying..."
          sleep 5
      done
      [[ -f "${SERVER_BINARY}" ]] || fail "SteamCMD could not install app ${SRCDS_APPID}; check the install log and free disk space"

      ## steamclient libraries; the server no longer ships them and loads ~/.steam/sdk64/steamclient.so
      mkdir -p /mnt/server/.steam/sdk32 /mnt/server/.steam/sdk64
      cp -v linux32/steamclient.so /mnt/server/.steam/sdk32/steamclient.so
      cp -v linux64/steamclient.so /mnt/server/.steam/sdk64/steamclient.so

      chmod +x "${SERVER_BINARY}"

      echo "-----------------------------------------"
      echo "Installation completed..."
      echo "-----------------------------------------"
variables:
  - name: Server Name
    description: Name shown in the server list.
    order: 1
    env_variable: SERVER_NAME
    default_value: s&box Server
    user_viewable: true
    user_editable: true
    rules: "required|string|max:63"
  - name: Game
    description: >-
      Package ident of the game to run, from its sbox.game page (e.g. facepunch.sandbox). Append
      #<version> to pin a version.
    order: 2
    env_variable: GAME
    default_value: facepunch.sandbox
    user_viewable: true
    user_editable: true
    rules: 'required|string|max:128|regex:/^[a-z0-9_-]+\.[a-z0-9_-]+(#\d+)?$/'
  - name: Map
    description: >-
      Package ident of the map to load (e.g. facepunch.flatgrass). Leave empty for the game's
      default scene.
    order: 3
    env_variable: MAP
    default_value: facepunch.flatgrass
    user_viewable: true
    user_editable: true
    rules: 'nullable|string|max:128|regex:/^[a-z0-9_-]+\.[a-z0-9_-]+(#\d+)?$/'
  - name: Steam Relay
    description: >-
      1 = players connect through Steam's relay network, which hides the server's IP and needs no
      open game port. 0 = players connect directly to the game port (primary allocation, UDP).
    order: 4
    env_variable: STEAM_RELAY
    default_value: "1"
    user_viewable: true
    user_editable: true
    rules: "required|in:0,1"
  - name: Query Port
    description: UDP port for Steam server queries (server list). Needs its own allocation.
    order: 5
    env_variable: QUERY_PORT
    default_value: "27016"
    user_viewable: true
    user_editable: false
    rules: "required|integer|between:1024,65535"
  - name: Game Server Login Token
    description: >-
      Optional Steam game server token (steamcommunity.com/dev/managegameservers, app ID 590830). Gives
      the server the same Steam ID on every start. Leave empty for an anonymous server.
    order: 6
    env_variable: GAME_SERVER_TOKEN
    default_value: ""
    user_viewable: true
    user_editable: true
    secret: true
    rules: 'nullable|string|max:64|regex:/^[A-Za-z0-9]+$/'
  - name: Extra Arguments
    description: Additional console variables or commands, e.g. +net_max_outgoing 2048.
    order: 7
    env_variable: EXTRA_ARGS
    default_value: ""
    user_viewable: true
    user_editable: true
    rules: "nullable|string|max:512"
  - name: Auto Update
    description: Update the server through SteamCMD on every start. (1 = on, 0 = off)
    order: 8
    env_variable: AUTO_UPDATE
    default_value: "1"
    user_viewable: true
    user_editable: true
    rules: "required|in:0,1"
  - name: Beta Branch
    description: >-
      Steam beta branch to install: staging (builds before live; players on the live branch may not
      be able to join). Leave empty for the live release. Reinstall after changing it.
    order: 9
    env_variable: SRCDS_BETAID
    default_value: ""
    user_viewable: true
    user_editable: true
    rules: "nullable|string|in:staging"
  - name: Steam App ID
    description: Steam app id of the s&box dedicated server.
    order: 10
    env_variable: SRCDS_APPID
    default_value: "1892930"
    user_viewable: false
    user_editable: false
    rules: "required|string|in:1892930"
