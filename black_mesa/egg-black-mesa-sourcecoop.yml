name: Black Mesa SourceCoop
author: thexylo@pm.me
description: >-
  Black Mesa, the Source engine remake of Half-Life, played as a co-op campaign with the
  SourceCoop mod (SourceMod plugin). Native Source dedicated server (Steam app 346680) with
  Metamod:Source, SourceMod and SourceCoop.
features:
  - gsl_token
  - steam_disk_space
docker_images:
  SteamCMD Debian: ghcr.io/caloptreyx/steamcmd:debian
file_denylist: []
startup_commands:
  # SourceCoop's SourceMod extension (sourcescramble) only exists for 32-bit servers, so the 32-bit
  # srcds_run is used. Co-op settings (teamplay, friendly fire, home map) are in bms/cfg/server.cfg.
  # srcds aborts while shutting down after quit; ulimit keeps that from writing a core file of
  # several hundred MB into the server directory on every stop.
  Default: >-
    ulimit -c 0; ./srcds_run -game bms -console -secure -port {{SERVER_PORT}} +ip 0.0.0.0 -strictportbind -norestart
    +maxplayers {{MAX_PLAYERS}} +mp_teamplay 1 +exec server.cfg +map "{{SRCDS_MAP}}"
    ${STEAM_TOKEN:+ +sv_setsteamaccount "${STEAM_TOKEN}"} {{EXTRA_ARGS}}
force_outgoing_ip: false
separate_port: false
config:
  files:
    bms/cfg/server.cfg:
      parser: file
      replace:
        - match: "hostname "
          replace_with: hostname "{{env.SERVER_NAME}}"
          insert_new: true
        - match: "sv_password "
          replace_with: sv_password "{{env.SERVER_PASSWORD}}"
          insert_new: true
        - match: "rcon_password "
          replace_with: rcon_password "{{env.RCON_PASSWORD}}"
          insert_new: true
        - match: "mp_friendlyfire "
          replace_with: "mp_friendlyfire {{env.FRIENDLY_FIRE}}"
          insert_new: true
        - match: "sourcecoop_homemap "
          replace_with: sourcecoop_homemap "{{env.SRCDS_MAP}}"
          insert_new: true
  startup:
    done:
      - gameserver Steam ID
      - Connection to Steam servers successful
    strip_ansi: false
  stop:
    type: command
    value: quit
scripts:
  installation:
    container: ghcr.io/caloptreyx/installers:debian
    entrypoint: bash
    content: |
      #!/bin/bash
      # Black Mesa SourceCoop dedicated server installation script
      #
      # Server files: /mnt/server
      # Installer image: ghcr.io/caloptreyx/installers:debian

      SERVER_BINARY=/mnt/server/srcds_run

      # Calagopus Wings ignores the installer exit code and only marks the installation as failed when
      # a reason is written to INSTALL_STATUS_FILE. Pterodactyl Wings leaves it unset and uses the exit code.
      fail() {
          echo -e "\n[ERROR] $1\n"
          if [[ -n "${INSTALL_STATUS_FILE}" ]]; then
              echo "$1" > "${INSTALL_STATUS_FILE}"
          fi
          exit 1
      }

      ## download and install steamcmd
      cd /tmp || fail "cannot enter /tmp"
      mkdir -p /mnt/server/steamcmd /mnt/server/steamapps # steamapps: avoids a steamcmd disk write error
      curl -fsSL -o steamcmd.tar.gz https://steamcdn-a.akamaihd.net/client/installer/steamcmd_linux.tar.gz \
          || fail "could not download SteamCMD"
      tar -xzf steamcmd.tar.gz -C /mnt/server/steamcmd || fail "could not extract SteamCMD"
      cd /mnt/server/steamcmd || fail "cannot enter /mnt/server/steamcmd"

      # SteamCMD fails otherwise, even as root; ownership is fixed by the daemon after install.
      chown -R root:root /mnt
      export HOME=/mnt/server

      ## install the game; the first attempt often fails with "Missing configuration"
      for attempt in 1 2 3; do
          ./steamcmd.sh +force_install_dir /mnt/server +login anonymous \
              +app_update "${SRCDS_APPID}" validate +quit && [[ -f "${SERVER_BINARY}" ]] && break
          echo "SteamCMD attempt ${attempt} failed, retrying..."
          sleep 5
      done
      [[ -f "${SERVER_BINARY}" ]] || fail "SteamCMD could not install app ${SRCDS_APPID}; check the install log and free disk space"

      ## steamclient libraries
      mkdir -p /mnt/server/.steam/sdk32 /mnt/server/.steam/sdk64
      cp -v linux32/steamclient.so /mnt/server/.steam/sdk32/steamclient.so
      cp -v linux64/steamclient.so /mnt/server/.steam/sdk64/steamclient.so

      ## Metamod:Source and SourceMod: the current stable builds (1.12)
      cd /tmp || fail "cannot enter /tmp"
      for pkg in "mms.alliedmods.net/mmsdrop/1.12/mmsource" "sm.alliedmods.net/smdrop/1.12/sourcemod"; do
          FILE=$(curl -fsSL "https://${pkg}-latest-linux") || fail "could not look up the latest ${pkg##*/} build"
          echo "Installing ${FILE}"
          curl -fsSL -o addon.tar.gz "https://${pkg%/*}/${FILE}" || fail "could not download ${FILE}"
          tar -xzf addon.tar.gz -C /mnt/server/bms || fail "could not extract ${FILE}"
          rm -f addon.tar.gz
      done

      ## SourceCoop: the newest release for Black Mesa
      SC_URL=$(curl -fsSL https://api.github.com/repos/ampreeT/SourceCoop/releases/latest \
          | jq -r '.assets[] | select(.name | test("-bms\\.zip$")) | .browser_download_url')
      [[ -n "${SC_URL}" ]] || fail "could not find the SourceCoop release for Black Mesa"
      echo "Installing ${SC_URL##*/}"
      curl -fsSL -o sourcecoop.zip "${SC_URL}" || fail "could not download ${SC_URL}"
      unzip -q -o sourcecoop.zip -d /mnt/server/bms || fail "could not extract ${SC_URL##*/}"
      rm -f sourcecoop.zip

      ## server.cfg: the developer's co-op settings, created when missing or blank
      CFG=/mnt/server/bms/cfg/server.cfg
      if ! grep -q '[^[:space:]]' "${CFG}" 2>/dev/null; then
          echo "Creating server.cfg..."
          cat > "${CFG}" << 'EOF'
      // Black Mesa SourceCoop server configuration.
      // hostname, passwords, friendly fire and the home map are set from the panel.
      hostname "Black Mesa: Coop"
      sv_password ""
      rcon_password ""
      // no-block, friendly team display (SourceCoop handles team switching)
      mp_teamplay 1
      mp_friendlyfire 0
      sv_always_run 0
      mp_timelimit 0
      mp_mapcycle_empty_timeout_seconds 3600
      // map the campaign returns to when it is finished
      sourcecoop_homemap "bm_c0a0a"
      // pre-caching of map data; disable if bm_c4a4a crashes or hangs
      mod_forcetouchdata 1
      sv_tags "custom, coop, sourcecoop"
      sv_cheats 0

      exec banned_user.cfg
      exec banned_ip.cfg
      EOF
      fi
      touch /mnt/server/bms/cfg/banned_user.cfg /mnt/server/bms/cfg/banned_ip.cfg

      echo "-----------------------------------------"
      echo "Installation completed..."
      echo "-----------------------------------------"
variables:
  - name: Server Name
    description: Name shown in the server browser. Cannot contain double quotes.
    order: 1
    env_variable: SERVER_NAME
    default_value: "Black Mesa: Coop"
    user_viewable: true
    user_editable: true
    rules:
      - required
      - string
      - max:64
      - 'regex:/^[^"\r\n]+$/'
  - name: Starting Map
    description: Campaign map to start on and return to after the campaign, e.g. bm_c0a0a.
    order: 2
    env_variable: SRCDS_MAP
    default_value: bm_c0a0a
    user_viewable: true
    user_editable: true
    rules:
      - required
      - string
      - max:64
      - 'regex:/^[\w-]+$/'
  - name: Max Players
    description: Maximum number of players.
    order: 3
    env_variable: MAX_PLAYERS
    default_value: "10"
    user_viewable: true
    user_editable: true
    rules:
      - required
      - integer
      - between:2,32
  - name: Friendly Fire
    description: Players can hurt each other. (1 = on, 0 = off)
    order: 4
    env_variable: FRIENDLY_FIRE
    default_value: "0"
    user_viewable: true
    user_editable: true
    rules:
      - required
      - in:0,1
  - name: Game Server Login Token
    description: >-
      Steam game server token (steamcommunity.com/dev/managegameservers, app ID 362890). Required for
      the server to appear in the public server list.
    order: 5
    env_variable: STEAM_TOKEN
    default_value: ""
    user_viewable: true
    user_editable: true
    secret: true
    rules:
      - nullable
      - string
      - 'regex:/^[A-F0-9]{32}$/'
  - name: Server Password
    description: Password players need to join. Leave empty for no password. Cannot contain double quotes.
    order: 6
    env_variable: SERVER_PASSWORD
    default_value: ""
    user_viewable: true
    user_editable: true
    secret: true
    rules:
      - nullable
      - string
      - max:64
      - 'regex:/^[^"\r\n]*$/'
  - name: RCON Password
    description: Remote console password. Leave empty to disable RCON. Cannot contain double quotes.
    order: 7
    env_variable: RCON_PASSWORD
    default_value: ""
    user_viewable: true
    user_editable: true
    secret: true
    rules:
      - nullable
      - string
      - max:64
      - 'regex:/^[^"\r\n]*$/'
  - name: Extra Arguments
    description: Additional launch parameters or convars.
    order: 8
    env_variable: EXTRA_ARGS
    default_value: ""
    user_viewable: true
    user_editable: true
    rules:
      - nullable
      - string
      - max:512
  - name: Auto Update
    description: Update the server through SteamCMD on every start. (1 = on, 0 = off)
    order: 9
    env_variable: AUTO_UPDATE
    default_value: "1"
    user_viewable: true
    user_editable: true
    rules:
      - required
      - in:0,1
  - name: Steam App ID
    description: "Steam app id of the Black Mesa dedicated server."
    order: 10
    env_variable: SRCDS_APPID
    default_value: "346680"
    user_viewable: false
    user_editable: false
    rules:
      - required
      - string
      - in:346680
