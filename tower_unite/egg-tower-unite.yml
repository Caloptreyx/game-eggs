name: Tower Unite
author: thexylo@pm.me
description: >-
  Tower Unite, the social game world with arcade minigames (Ball Race, Minigolf, Virus, Zombie
  Massacre, ...) and the Plaza. Native Linux dedicated server (Steam app 439660).
features:
  - gsl_token
  - steam_disk_space
docker_images:
  SteamCMD Debian: ghcr.io/caloptreyx/steamcmd:debian
file_denylist: []
startup_commands:
  # Title, player limit, Steam login token and admin are written to Tower/Saved/Config/TowerServer.ini
  # on every start (seeded by the installer). The server logs to the console but reads no console
  # input; the stop signal (SIGINT) shuts it down.
  Default: >-
    ./Tower/Binaries/Linux/TowerServer-Linux-Shipping -log -Port={{SERVER_PORT}} -QueryPort={{QUERY_PORT}} -MULTIHOME=0.0.0.0
    -TowerServerINI=../../Saved/Config/TowerServer.ini {{EXTRA_ARGS}}
force_outgoing_ip: false
separate_port: false
config:
  files:
    Tower/Saved/Config/TowerServer.ini:
      parser: ini
      replace:
        - match: "[/Script/TowerNetworking.DedicatedServerOptions].MaxPlayers"
          replace_with: "{{env.MAX_PLAYERS}}"
        - match: "[/Script/TowerNetworking.DedicatedServerOptions].ServerTitle"
          replace_with: "{{env.SERVER_NAME}}"
        - match: "[/Script/TowerNetworking.DedicatedServerOptions].SteamLoginToken"
          replace_with: "{{env.STEAM_TOKEN}}"
        - match: "[Administration].AdminSteamID"
          replace_with: "{{env.ADMIN_STEAM_ID}}"
  startup:
    done:
      - "Match State Changed from EnteringMap to WaitingToStart"
    strip_ansi: true
  stop:
    type: signal
    value: SIGINT
scripts:
  installation:
    container: ghcr.io/caloptreyx/installers:debian
    entrypoint: bash
    content: |
      #!/bin/bash
      # Tower Unite dedicated server installation script (native Linux build)
      #
      # Server files: /mnt/server
      # Installer image: ghcr.io/caloptreyx/installers:debian

      SERVER_BINARY=/mnt/server/Tower/Binaries/Linux/TowerServer-Linux-Shipping

      # Calagopus Wings ignores the installer exit code and only marks the installation as failed when
      # a reason is written to INSTALL_STATUS_FILE. Pterodactyl Wings leaves it unset and uses the exit code.
      fail() {
          echo -e "\n[ERROR] $1\n"
          if [[ -n "${INSTALL_STATUS_FILE}" ]]; then
              echo "$1" > "${INSTALL_STATUS_FILE}"
          fi
          exit 1
      }

      ## download and install steamcmd
      cd /tmp || fail "cannot enter /tmp"
      mkdir -p /mnt/server/steamcmd /mnt/server/steamapps # steamapps: avoids a steamcmd disk write error
      curl -fsSL -o steamcmd.tar.gz https://steamcdn-a.akamaihd.net/client/installer/steamcmd_linux.tar.gz \
          || fail "could not download SteamCMD"
      tar -xzf steamcmd.tar.gz -C /mnt/server/steamcmd || fail "could not extract SteamCMD"
      cd /mnt/server/steamcmd || fail "cannot enter /mnt/server/steamcmd"

      # SteamCMD fails otherwise, even as root; ownership is fixed by the daemon after install.
      chown -R root:root /mnt
      export HOME=/mnt/server

      ## install the game; downloads occasionally abort with a steamcmd state error
      for attempt in 1 2 3; do
          ./steamcmd.sh +force_install_dir /mnt/server +login anonymous \
              +app_update "${SRCDS_APPID}" validate +quit && [[ -f "${SERVER_BINARY}" ]] && break
          echo "SteamCMD attempt ${attempt} failed, retrying..."
          sleep 5
      done
      [[ -f "${SERVER_BINARY}" ]] || fail "SteamCMD could not install app ${SRCDS_APPID}; check the install log and free disk space"

      ## steamclient libraries (the server also loads one from its binary folder)
      mkdir -p /mnt/server/.steam/sdk32 /mnt/server/.steam/sdk64
      cp -v linux32/steamclient.so /mnt/server/.steam/sdk32/steamclient.so
      cp -v linux64/steamclient.so /mnt/server/.steam/sdk64/steamclient.so
      cp -v linux64/steamclient.so /mnt/server/Tower/Binaries/Linux/steamclient.so

      chmod +x "${SERVER_BINARY}"

      ## TowerServer.ini: seeded once with the keys the panel manages
      INI=/mnt/server/Tower/Saved/Config/TowerServer.ini
      mkdir -p "$(dirname "${INI}")"
      if [[ ! -f "${INI}" ]]; then
          cat > "${INI}" << 'EOF'
      [/Script/TowerNetworking.DedicatedServerOptions]
      MaxPlayers=40
      ServerTitle=Tower Unite Server
      SteamLoginToken=

      [Administration]
      AdminSteamID=
      EOF
      fi

      echo "-----------------------------------------"
      echo "Installation completed..."
      echo "-----------------------------------------"
variables:
  - name: Server Name
    description: Title shown in the server list.
    order: 1
    env_variable: SERVER_NAME
    default_value: Tower Unite Server
    user_viewable: true
    user_editable: true
    rules:
      - required
      - string
      - max:64
      - 'regex:/^[^\r\n]+$/'
  - name: Max Players
    description: Maximum number of players.
    order: 2
    env_variable: MAX_PLAYERS
    default_value: "40"
    user_viewable: true
    user_editable: true
    rules:
      - required
      - integer
      - between:1,200
  - name: Admin Steam ID
    description: SteamID64 of the server admin. Leave empty for none.
    order: 3
    env_variable: ADMIN_STEAM_ID
    default_value: ""
    user_viewable: true
    user_editable: true
    rules:
      - nullable
      - string
      - 'regex:/^(\d{17})?$/'
  - name: Game Server Login Token
    description: >-
      Steam game server token (steamcommunity.com/dev/managegameservers, app ID 394690) for the
      public server list. Leave empty to run without one.
    order: 4
    env_variable: STEAM_TOKEN
    default_value: ""
    user_viewable: true
    user_editable: true
    secret: true
    rules:
      - nullable
      - string
      - 'regex:/^([A-F0-9]{32})?$/'
  - name: Query Port
    description: UDP port for Steam server queries. Needs its own allocation.
    order: 5
    env_variable: QUERY_PORT
    default_value: "27015"
    user_viewable: true
    user_editable: false
    rules:
      - required
      - integer
      - between:1024,65535
  - name: Extra Arguments
    description: Additional launch parameters.
    order: 6
    env_variable: EXTRA_ARGS
    default_value: ""
    user_viewable: true
    user_editable: true
    rules:
      - nullable
      - string
      - max:512
      - 'regex:/^[^\r\n]*$/'
  - name: Auto Update
    description: Update the server through SteamCMD on every start. (1 = on, 0 = off)
    order: 7
    env_variable: AUTO_UPDATE
    default_value: "1"
    user_viewable: true
    user_editable: true
    rules:
      - required
      - in:0,1
  - name: Steam App ID
    description: Steam app id of the Tower Unite dedicated server.
    order: 8
    env_variable: SRCDS_APPID
    default_value: "439660"
    user_viewable: false
    user_editable: false
    rules:
      - required
      - string
      - in:439660
