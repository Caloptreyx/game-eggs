name: Counter-Strike 2
author: thexylo@pm.me
description: >-
  Counter-Strike 2, the tactical team shooter. Native Linux dedicated server (Steam app 730,
  installed anonymously).
features:
  - gsl_token
  - steam_disk_space
docker_images:
  SteamCMD Debian: ghcr.io/caloptreyx/steamcmd:debian
file_denylist: []
startup_commands:
  # cs2 is started directly with its own library directory; cs2.sh only adds the Steam runtime,
  # which the image replaces. Game Mode is a game_alias (casual, competitive, wingman, ...), which
  # sets game_type and game_mode together. -insecure turns VAC off. Values are expanded inside
  # quotes, never re-parsed by the shell. ulimit keeps a crash from writing a core file of several
  # GB into the server directory.
  Default: >-
    ulimit -c 0; LD_LIBRARY_PATH="/home/container/game/bin/linuxsteamrt64:${LD_LIBRARY_PATH}"
    ./game/bin/linuxsteamrt64/cs2 -dedicated -console -ip 0.0.0.0 -port {{SERVER_PORT}} -strictportbind
    -maxplayers {{MAX_PLAYERS}} $( [ "${VAC_ENABLED}" = "1" ] || printf %s -insecure )
    $( [ "${RCON_PASSWORD}" = "" ] || printf %s -usercon )
    +game_alias "${GAME_MODE}" +map "${SRCDS_MAP}"
    ${STEAM_TOKEN:+ +sv_setsteamaccount "${STEAM_TOKEN}"} {{EXTRA_ARGS}}
force_outgoing_ip: false
separate_port: false
config:
  files:
    game/csgo/cfg/server.cfg:
      parser: file
      replace:
        - match: "hostname "
          replace_with: hostname "{{env.SERVER_NAME}}"
          insert_new: true
        - match: "sv_password "
          replace_with: sv_password "{{env.SERVER_PASSWORD}}"
          insert_new: true
        - match: "rcon_password "
          replace_with: rcon_password "{{env.RCON_PASSWORD}}"
          insert_new: true
  startup:
    done:
      - Connection to Steam servers successful
    strip_ansi: false
  stop:
    type: command
    value: quit
scripts:
  installation:
    container: ghcr.io/caloptreyx/installers:debian
    entrypoint: bash
    content: |
      #!/bin/bash
      # Counter-Strike 2 dedicated server installation script
      #
      # Server files: /mnt/server
      # Installer image: ghcr.io/caloptreyx/installers:debian

      SERVER_BINARY=/mnt/server/game/bin/linuxsteamrt64/cs2

      # Calagopus Wings ignores the installer exit code and only marks the installation as failed when
      # a reason is written to INSTALL_STATUS_FILE. Pterodactyl Wings leaves it unset and uses the exit code.
      fail() {
          echo -e "\n[ERROR] $1\n"
          if [[ -n "${INSTALL_STATUS_FILE}" ]]; then
              echo "$1" > "${INSTALL_STATUS_FILE}"
          fi
          exit 1
      }

      ## download and install steamcmd
      cd /tmp || fail "cannot enter /tmp"
      mkdir -p /mnt/server/steamcmd /mnt/server/steamapps # steamapps: avoids a steamcmd disk write error
      curl -fsSL -o steamcmd.tar.gz https://steamcdn-a.akamaihd.net/client/installer/steamcmd_linux.tar.gz \
          || fail "could not download SteamCMD"
      tar -xzf steamcmd.tar.gz -C /mnt/server/steamcmd || fail "could not extract SteamCMD"
      cd /mnt/server/steamcmd || fail "cannot enter /mnt/server/steamcmd"

      # SteamCMD fails otherwise, even as root; ownership is fixed by the daemon after install.
      chown -R root:root /mnt
      export HOME=/mnt/server

      ## install the game (about 60 GB); large downloads occasionally abort with a steamcmd state error
      for attempt in 1 2 3; do
          ./steamcmd.sh +force_install_dir /mnt/server +login anonymous +app_update "${SRCDS_APPID}" validate \
              +quit && [[ -f "${SERVER_BINARY}" ]] && break
          echo "SteamCMD attempt ${attempt} failed, retrying..."
          sleep 5
      done
      [[ -f "${SERVER_BINARY}" ]] || fail "SteamCMD could not install app ${SRCDS_APPID}; check the install log and free disk space"

      ## steamclient libraries; cs2 loads the 64-bit one from ~/.steam/sdk64
      mkdir -p /mnt/server/.steam/sdk32 /mnt/server/.steam/sdk64
      cp -v linux32/steamclient.so /mnt/server/.steam/sdk32/steamclient.so
      cp -v linux64/steamclient.so /mnt/server/.steam/sdk64/steamclient.so

      ## server.cfg: the panel keeps hostname and passwords in sync on every start.
      # Only created when missing or blank, so custom settings survive reinstalls.
      CFG=/mnt/server/game/csgo/cfg/server.cfg
      if ! grep -q '[^[:space:]]' "${CFG}" 2>/dev/null; then
          echo "Creating server.cfg..."
          cat > "${CFG}" << 'EOF'
      // Counter-Strike 2 server configuration.
      // hostname, sv_password and rcon_password are set from the panel.
      hostname "Counter-Strike 2 Server"
      sv_password ""
      rcon_password ""

      sv_lan 0
      sv_logbans 1
      sv_logecho 1
      sv_logfile 1
      EOF
      fi

      echo "-----------------------------------------"
      echo "Installation completed..."
      echo "-----------------------------------------"
variables:
  - name: Server Name
    description: Name shown in the server browser. Cannot contain double quotes.
    order: 1
    env_variable: SERVER_NAME
    default_value: Counter-Strike 2 Server
    user_viewable: true
    user_editable: true
    rules: 'required|string|max:64|regex:/^[^"\r\n]+$/'
  - name: Game Mode
    description: Game mode the server runs (sets game_type and game_mode).
    order: 2
    env_variable: GAME_MODE
    default_value: competitive
    user_viewable: true
    user_editable: true
    rules: "required|in:casual,competitive,wingman,deathmatch,armsrace,custom"
  - name: Map
    description: Map to load on start, e.g. de_dust2, de_mirage, de_inferno, de_nuke or ar_shoots.
    order: 3
    env_variable: SRCDS_MAP
    default_value: de_dust2
    user_viewable: true
    user_editable: true
    rules: 'required|string|max:64|regex:/^[\w-]+$/'
  - name: Max Players
    description: Maximum number of players.
    order: 4
    env_variable: MAX_PLAYERS
    default_value: "10"
    user_viewable: true
    user_editable: true
    rules: "required|integer|between:2,64"
  - name: Game Server Login Token
    description: >-
      Steam game server token (steamcommunity.com/dev/managegameservers, app ID 730). Required for
      players outside the server's network to join and for the public server list.
    order: 5
    env_variable: STEAM_TOKEN
    default_value: ""
    user_viewable: true
    user_editable: true
    secret: true
    rules: 'nullable|string|regex:/^[A-F0-9]{32}$/'
  - name: Server Password
    description: Password players need to join. Leave empty for no password. Cannot contain double quotes.
    order: 6
    env_variable: SERVER_PASSWORD
    default_value: ""
    user_viewable: true
    user_editable: true
    secret: true
    rules: 'nullable|string|max:64|regex:/^[^"\r\n]*$/'
  - name: RCON Password
    description: Remote console password. Leave empty to disable RCON. Cannot contain double quotes.
    order: 7
    env_variable: RCON_PASSWORD
    default_value: ""
    user_viewable: true
    user_editable: true
    secret: true
    rules: 'nullable|string|max:64|regex:/^[^"\r\n]*$/'
  - name: VAC
    description: Valve Anti-Cheat. (1 = on, 0 = off, the server runs -insecure)
    order: 8
    env_variable: VAC_ENABLED
    default_value: "1"
    user_viewable: true
    user_editable: true
    rules: "required|in:0,1"
  - name: Extra Arguments
    description: Additional launch parameters or convars, e.g. +bot_quota 4 +mp_maxrounds 24.
    order: 9
    env_variable: EXTRA_ARGS
    default_value: ""
    user_viewable: true
    user_editable: true
    rules: "nullable|string|max:512"
  - name: Auto Update
    description: Update the server through SteamCMD on every start. (1 = on, 0 = off)
    order: 10
    env_variable: AUTO_UPDATE
    default_value: "1"
    user_viewable: true
    user_editable: true
    rules: "required|in:0,1"
  - name: Steam App ID
    description: Steam app id of the Counter-Strike 2 dedicated server.
    order: 11
    env_variable: SRCDS_APPID
    default_value: "730"
    user_viewable: false
    user_editable: false
    rules: "required|string|in:730"
