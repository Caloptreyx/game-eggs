name: SCUM
author: thexylo@pm.me
description: >-
  Open world survival game with in-depth character simulation, crafting, base building and PvP on
  a prison island. The Windows-only dedicated server (Steam app 3792580) runs through Proton.
features:
  - steam_disk_space
docker_images:
  Proton: ghcr.io/caloptreyx/steamcmd:proton
file_denylist: []
startup_commands:
  # The server's own output is unusable under Proton, so SCUM.log is streamed to the console. The
  # server reads no console input and has no RCON. It hangs during startup without a display, so it
  # gets a virtual one (Xvfb). SteamAppId=513710 (the game) lets it find Steam. The prefix reports
  # Windows 7: on newer versions the server checks DLL signatures, which fails under Proton and
  # disables multiplayer. Xvfb and the server run in their own sessions so the stop signal only
  # reaches the shell, which closes the server window like Windows does (taskkill); the server then
  # saves and closes the database. Ctrl+C would kill it without saving. The shell waits for it to exit.
  # Keep "} }" spaced: "}}" is a placeholder delimiter for the image.
  Default: >-
    mkdir -p SCUM/Saved/Logs; : > SCUM/Saved/Logs/SCUM.log; rm -f /tmp/.X99-lock;
    proton run reg add 'HKCU\Software\Wine' /v Version /d win7 /f >/dev/null 2>&1;
    setsid Xvfb :99 -screen 0 1024x768x24 -nolisten tcp & XVFB=$!;
    DISPLAY=:99 SteamAppId=513710 setsid proton run ./SCUM/Binaries/Win64/SCUMServer.exe -log
    -port={{SERVER_PORT}} -QueryPort={{QUERY_PORT}} -MaxPlayers={{MAX_PLAYERS}}
    {{EXTRA_ARGS}} </dev/null & SRV=$!;
    trap "WINEPREFIX=${STEAM_COMPAT_DATA_PATH}/pfx /usr/local/bin/files/bin/wine taskkill /IM SCUMServer.exe >/dev/null 2>&1" INT;
    tail -n +1 -F SCUM/Saved/Logs/SCUM.log --pid=${SRV} 2>/dev/null &
    while kill -0 ${SRV} 2>/dev/null; do wait ${SRV}; done; kill ${XVFB} 2>/dev/null
force_outgoing_ip: false
separate_port: false
config:
  files:
    SCUM/Saved/Config/WindowsServer/ServerSettings.ini:
      parser: ini
      replace:
        - match: General.scum.ServerName
          replace_with: "{{env.SERVER_NAME}}"
        - match: General.scum.ServerPassword
          replace_with: "{{env.SERVER_PASSWORD}}"
        - match: General.scum.MaxPlayers
          replace_with: "{{env.MAX_PLAYERS}}"
        - match: General.scum.ServerPlaystyle
          replace_with: "{{env.SERVER_PLAYSTYLE}}"
  startup:
    done:
      - "LogSCUM: Global Stats:"
    strip_ansi: false
  stop:
    type: signal
    value: SIGINT
scripts:
  installation:
    container: ghcr.io/caloptreyx/installers:debian
    entrypoint: bash
    content: |
      #!/bin/bash
      # SCUM dedicated server installation script (Windows server, run through Proton)
      #
      # Server files: /mnt/server
      # Installer image: ghcr.io/caloptreyx/installers:debian

      SERVER_BINARY=/mnt/server/SCUM/Binaries/Win64/SCUMServer.exe

      # Calagopus Wings ignores the installer exit code and only marks the installation as failed when
      # a reason is written to INSTALL_STATUS_FILE. Pterodactyl Wings leaves it unset and uses the exit code.
      fail() {
          echo -e "\n[ERROR] $1\n"
          if [[ -n "${INSTALL_STATUS_FILE}" ]]; then
              echo "$1" > "${INSTALL_STATUS_FILE}"
          fi
          exit 1
      }

      ## download and install steamcmd
      cd /tmp || fail "cannot enter /tmp"
      mkdir -p /mnt/server/steamcmd /mnt/server/steamapps # steamapps: avoids a steamcmd disk write error
      curl -fsSL -o steamcmd.tar.gz https://steamcdn-a.akamaihd.net/client/installer/steamcmd_linux.tar.gz \
          || fail "could not download SteamCMD"
      tar -xzf steamcmd.tar.gz -C /mnt/server/steamcmd || fail "could not extract SteamCMD"
      cd /mnt/server/steamcmd || fail "cannot enter /mnt/server/steamcmd"

      # SteamCMD fails otherwise, even as root; ownership is fixed by the daemon after install.
      chown -R root:root /mnt
      export HOME=/mnt/server

      ## install the Windows server; the first attempt often fails with "Missing configuration"
      for attempt in 1 2 3; do
          ./steamcmd.sh +force_install_dir /mnt/server +@sSteamCmdForcePlatformType windows +login anonymous \
              +app_update "${SRCDS_APPID}" validate +quit && [[ -f "${SERVER_BINARY}" ]] && break
          echo "SteamCMD attempt ${attempt} failed, retrying..."
          sleep 5
      done
      if [[ ! -f "${SERVER_BINARY}" ]]; then
          fail "SteamCMD could not install app ${SRCDS_APPID}; check the install log and that about 20 GB of disk space is free"
      fi

      ## steamclient libraries
      mkdir -p /mnt/server/.steam/sdk32 /mnt/server/.steam/sdk64
      cp -v linux32/steamclient.so /mnt/server/.steam/sdk32/steamclient.so
      cp -v linux64/steamclient.so /mnt/server/.steam/sdk64/steamclient.so

      mkdir -p /mnt/server/SCUM/Saved/Logs /mnt/server/SCUM/Saved/Config/WindowsServer

      echo "-----------------------------------------"
      echo "Installation completed..."
      echo "-----------------------------------------"
variables:
  - name: Server Name
    description: Name shown in the server browser.
    order: 1
    env_variable: SERVER_NAME
    default_value: SCUM Server
    user_viewable: true
    user_editable: true
    rules: "required|string|max:64"
  - name: Server Password
    description: Password players need to join. Leave empty for a public server.
    order: 2
    env_variable: SERVER_PASSWORD
    default_value: ""
    user_viewable: true
    user_editable: true
    secret: true
    rules: "nullable|string|max:64"
  - name: Max Players
    description: Maximum number of players. More players need more memory (see the README).
    order: 3
    env_variable: MAX_PLAYERS
    default_value: "64"
    user_viewable: true
    user_editable: true
    rules: "required|integer|between:1,128"
  - name: Playstyle
    description: Playstyle shown in the server browser (PVE, PVP, PVPVE, RPPVE, RPPVP).
    order: 4
    env_variable: SERVER_PLAYSTYLE
    default_value: PVE
    user_viewable: true
    user_editable: true
    rules: "required|in:PVE,PVP,PVPVE,RPPVE,RPPVP"
  - name: Query Port
    description: UDP port for Steam server queries (server browser). Needs its own allocation.
    order: 5
    env_variable: QUERY_PORT
    default_value: "27015"
    user_viewable: true
    user_editable: false
    rules: "required|integer|between:1024,65535"
  - name: Extra Arguments
    description: Additional server launch parameters, e.g. -nobattleye.
    order: 6
    env_variable: EXTRA_ARGS
    default_value: ""
    user_viewable: true
    user_editable: true
    rules: "nullable|string|max:512"
  - name: Auto Update
    description: Update the server through SteamCMD on every start. (1 = on, 0 = off)
    order: 7
    env_variable: AUTO_UPDATE
    default_value: "1"
    user_viewable: true
    user_editable: true
    rules: "required|in:0,1"
  - name: Steam App ID
    description: Steam app id of the SCUM dedicated server.
    order: 8
    env_variable: SRCDS_APPID
    default_value: "3792580"
    user_viewable: false
    user_editable: false
    rules: "required|string|in:3792580"
  - name: Windows Install
    description: The server is Windows-only; auto updates must download the Windows files.
    order: 9
    env_variable: WINDOWS_INSTALL
    default_value: "1"
    user_viewable: false
    user_editable: false
    rules: "required|in:1"
