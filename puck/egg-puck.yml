name: Puck
author: thexylo@pm.me
description: >-
  Puck, the physics-based multiplayer ice hockey game. Native Linux dedicated server (Steam app
  3481440), installed anonymously.
features:
  - steam_disk_space
docker_images:
  SteamCMD Debian: ghcr.io/caloptreyx/steamcmd:debian
file_denylist: []
startup_commands:
  # The server reads server_config.json from the server root (created by the installer). Name,
  # password, player limit, port and public listing are written into it on every start; everything
  # else (tick rate, mods, whitelist, game mode, ...) stays yours. The server loads the libraries
  # shipped next to it. It reads no console input; the stop signal (SIGINT) ends it.
  Default: >-
    LD_LIBRARY_PATH=/home/container ./Puck -batchmode -nographics
force_outgoing_ip: false
separate_port: false
config:
  files:
    server_config.json:
      parser: json
      create_new: false
      replace:
        - match: port
          replace_with: "{{server.build.default.port}}"
        - match: name
          replace_with: '"{{env.SERVER_NAME}}"'
        - match: password
          replace_with: '"{{env.SERVER_PASSWORD}}"'
        - match: maxPlayers
          replace_with: "{{env.MAX_PLAYERS}}"
        - match: isPublic
          replace_with: "{{env.PUBLIC}}"
  startup:
    done:
      - "is ready to accept clients"
    strip_ansi: false
  stop:
    type: signal
    value: SIGINT
scripts:
  installation:
    container: ghcr.io/caloptreyx/installers:debian
    entrypoint: bash
    content: |
      #!/bin/bash
      # Puck dedicated server installation script
      #
      # Server files: /mnt/server
      # Installer image: ghcr.io/caloptreyx/installers:debian

      SERVER_BINARY=/mnt/server/Puck

      # Calagopus Wings ignores the installer exit code and only marks the installation as failed when
      # a reason is written to INSTALL_STATUS_FILE. Pterodactyl Wings leaves it unset and uses the exit code.
      fail() {
          echo -e "\n[ERROR] $1\n"
          if [[ -n "${INSTALL_STATUS_FILE}" ]]; then
              echo "$1" > "${INSTALL_STATUS_FILE}"
          fi
          exit 1
      }

      ## download and install steamcmd
      cd /tmp || fail "cannot enter /tmp"
      mkdir -p /mnt/server/steamcmd /mnt/server/steamapps # steamapps: avoids a steamcmd disk write error
      curl -fsSL -o steamcmd.tar.gz https://steamcdn-a.akamaihd.net/client/installer/steamcmd_linux.tar.gz \
          || fail "could not download SteamCMD"
      tar -xzf steamcmd.tar.gz -C /mnt/server/steamcmd || fail "could not extract SteamCMD"
      cd /mnt/server/steamcmd || fail "cannot enter /mnt/server/steamcmd"

      # SteamCMD fails otherwise, even as root; ownership is fixed by the daemon after install.
      chown -R root:root /mnt
      export HOME=/mnt/server

      ## install the server; the first attempt often fails with "Missing configuration"
      for attempt in 1 2 3; do
          ./steamcmd.sh +force_install_dir /mnt/server +login anonymous +app_update "${SRCDS_APPID}" validate \
              +quit && [[ -f "${SERVER_BINARY}" ]] && break
          echo "SteamCMD attempt ${attempt} failed, retrying..."
          sleep 5
      done
      [[ -f "${SERVER_BINARY}" ]] || fail "SteamCMD could not install app ${SRCDS_APPID}; check the install log and free disk space"

      ## steamclient libraries
      mkdir -p /mnt/server/.steam/sdk32 /mnt/server/.steam/sdk64
      cp -v linux32/steamclient.so /mnt/server/.steam/sdk32/steamclient.so
      cp -v linux64/steamclient.so /mnt/server/.steam/sdk64/steamclient.so

      chmod +x "${SERVER_BINARY}"

      ## server_config.json: created once with the server's defaults (the server would otherwise create
      ## it on its first start, with a random port); the panel keeps its settings in sync on every start
      if [[ ! -f /mnt/server/server_config.json ]]; then
          cat > /mnt/server/server_config.json << 'EOF'
      {
        "port": 7777,
        "name": "Puck Server",
        "maxPlayers": 12,
        "password": "",
        "tickRate": 200,
        "isPublic": true,
        "useVoip": false,
        "useWhitelist": false,
        "mods": [],
        "gameMode": "public",
        "level": "default"
      }
      EOF
      fi

      echo "-----------------------------------------"
      echo "Installation completed..."
      echo "-----------------------------------------"
variables:
  - name: Server Name
    description: Name shown in the server browser.
    order: 1
    env_variable: SERVER_NAME
    default_value: Puck Server
    user_viewable: true
    user_editable: true
    rules: 'required|string|max:64|regex:/^[^"\\\r\n]+$/'
  - name: Server Password
    description: Password players need to join. Leave empty for no password.
    order: 2
    env_variable: SERVER_PASSWORD
    default_value: ""
    user_viewable: true
    user_editable: true
    secret: true
    rules: 'nullable|string|max:64|regex:/^[^"\\\r\n]*$/'
  - name: Max Players
    description: Maximum number of players.
    order: 3
    env_variable: MAX_PLAYERS
    default_value: "10"
    user_viewable: true
    user_editable: true
    rules: "required|integer|between:2,40"
  - name: Public
    description: List the server in the public server browser. (true / false)
    order: 4
    env_variable: PUBLIC
    default_value: "true"
    user_viewable: true
    user_editable: true
    rules: "required|in:true,false"
  - name: Auto Update
    description: Update the server through SteamCMD on every start. (1 = on, 0 = off)
    order: 5
    env_variable: AUTO_UPDATE
    default_value: "1"
    user_viewable: true
    user_editable: true
    rules: "required|in:0,1"
  - name: Steam App ID
    description: Steam app id of the Puck dedicated server.
    order: 6
    env_variable: SRCDS_APPID
    default_value: "3481440"
    user_viewable: false
    user_editable: false
    rules: "required|string|in:3481440"
