name: 'RuneScape: Dragonwilds'
author: thexylo@pm.me
description: >-
  On RuneScape's forgotten continent of Ashenfall, dragons have awoken. Gather, build, skill and
  craft in this co-operative survival adventure. Native Linux dedicated server (Steam app 4019830).
features:
  - steam_disk_space
docker_images:
  SteamCMD Debian: ghcr.io/caloptreyx/steamcmd:debian
file_denylist: []
startup_commands:
  # The server logs to stdout with -log and reads no console input. It only needs the game port and
  # the beacon port on the command line; everything else comes from DedicatedServer.ini, which the
  # panel rewrites on every start. The server saves as the world changes; the stop signal (SIGINT)
  # makes it finish pending saves and exit cleanly.
  Default: >-
    ./RSDragonwilds/Binaries/Linux/RSDragonwildsServer-Linux-Shipping RSDragonwilds -log
    -Port={{SERVER_PORT}} -BeaconPort={{BEACON_PORT}} {{EXTRA_ARGS}}
force_outgoing_ip: false
separate_port: false
config:
  files:
    RSDragonwilds/Saved/Config/LinuxServer/DedicatedServer.ini:
      parser: ini
      # insert_new restores keys missing from the file: the server removes AdminPassword once it
      # has read it.
      replace:
        - match: "[/Script/Dominion.DedicatedServerSettings].OwnerId"
          replace_with: "{{env.OWNER_ID}}"
          insert_new: true
        - match: "[/Script/Dominion.DedicatedServerSettings].ServerName"
          replace_with: "{{env.SERVER_NAME}}"
          insert_new: true
        - match: "[/Script/Dominion.DedicatedServerSettings].DefaultWorldName"
          replace_with: "{{env.WORLD_NAME}}"
          insert_new: true
        - match: "[/Script/Dominion.DedicatedServerSettings].WorldPassword"
          replace_with: "{{env.WORLD_PASSWORD}}"
          insert_new: true
        - match: "[/Script/Dominion.DedicatedServerSettings].AdminPassword"
          replace_with: "{{env.ADMIN_PASSWORD}}"
          insert_new: true
        - match: "[/Script/Dominion.DedicatedServerSettings].AdministratorList"
          replace_with: "({{env.ADMINS}})"
          insert_new: true
  startup:
    done:
      - START SESSION - Success
    strip_ansi: false
  stop:
    type: signal
    value: SIGINT
scripts:
  installation:
    container: ghcr.io/caloptreyx/installers:debian
    entrypoint: bash
    content: |
      #!/bin/bash
      # RuneScape: Dragonwilds dedicated server installation script (native Linux build)
      #
      # Server files: /mnt/server
      # Installer image: ghcr.io/caloptreyx/installers:debian

      SERVER_BINARY=/mnt/server/RSDragonwilds/Binaries/Linux/RSDragonwildsServer-Linux-Shipping
      CONFIG_DIR=/mnt/server/RSDragonwilds/Saved/Config/LinuxServer

      # Calagopus Wings ignores the installer exit code and only marks the installation as failed when
      # a reason is written to INSTALL_STATUS_FILE. Pterodactyl Wings leaves it unset and uses the exit code.
      fail() {
          echo -e "\n[ERROR] $1\n"
          if [[ -n "${INSTALL_STATUS_FILE}" ]]; then
              echo "$1" > "${INSTALL_STATUS_FILE}"
          fi
          exit 1
      }

      ## download and install steamcmd
      cd /tmp || fail "cannot enter /tmp"
      mkdir -p /mnt/server/steamcmd /mnt/server/steamapps # steamapps: avoids a steamcmd disk write error
      curl -fsSL -o steamcmd.tar.gz https://steamcdn-a.akamaihd.net/client/installer/steamcmd_linux.tar.gz \
          || fail "could not download SteamCMD"
      tar -xzf steamcmd.tar.gz -C /mnt/server/steamcmd || fail "could not extract SteamCMD"
      cd /mnt/server/steamcmd || fail "cannot enter /mnt/server/steamcmd"

      # SteamCMD fails otherwise, even as root; ownership is fixed by the daemon after install.
      chown -R root:root /mnt
      export HOME=/mnt/server

      ## install the game; the first attempt often fails with "Missing configuration"
      for attempt in 1 2 3; do
          ./steamcmd.sh +force_install_dir /mnt/server +login anonymous \
              +app_update "${SRCDS_APPID}" validate +quit && [[ -f "${SERVER_BINARY}" ]] && break
          echo "SteamCMD attempt ${attempt} failed, retrying..."
          sleep 5
      done
      [[ -f "${SERVER_BINARY}" ]] || fail "SteamCMD could not install app ${SRCDS_APPID}; check the install log and free disk space"

      ## steamclient libraries
      mkdir -p /mnt/server/.steam/sdk32 /mnt/server/.steam/sdk64
      cp -v linux32/steamclient.so /mnt/server/.steam/sdk32/steamclient.so
      cp -v linux64/steamclient.so /mnt/server/.steam/sdk64/steamclient.so

      chmod +x "${SERVER_BINARY}"

      ## server configuration
      # The server only writes DedicatedServer.ini on its first start and refuses to run without an
      # owner, so the file (layout of Jagex's official container template) is created here and the
      # panel fills in its values on every start. An existing file is kept.
      mkdir -p "${CONFIG_DIR}" /mnt/server/RSDragonwilds/Saved/SaveGames
      if [[ ! -f "${CONFIG_DIR}/DedicatedServer.ini" ]]; then
          cat > "${CONFIG_DIR}/DedicatedServer.ini" << 'EOF'
      [SectionsToSave]
      bCanSaveAllSections=true

      [/Script/Dominion.DedicatedServerSettings]
      AdminPassword=
      WorldPassword=
      ServerGuid=
      ServerName=
      DefaultWorldName=
      AdministratorList=()
      OwnerId=
      EOF
      fi

      echo "-----------------------------------------"
      echo "Installation completed..."
      echo "-----------------------------------------"
variables:
  - name: Owner ID
    description: >-
      Your RuneScape: Dragonwilds Player ID (32 letters and digits), shown in game at the bottom of
      the Settings menu. Required: the server does not start without it. The owner can ban and unban
      anyone.
    order: 1
    env_variable: OWNER_ID
    default_value: ""
    user_viewable: true
    user_editable: true
    rules:
      - required
      - string
      - 'regex:/^[A-Za-z0-9]{32}$/'
  - name: Server Name
    description: Shown in the "Created By" column of the Worlds list.
    order: 2
    env_variable: SERVER_NAME
    default_value: Dragonwilds Server
    user_viewable: true
    user_editable: true
    rules:
      - required
      - string
      - max:32
  - name: World Name
    description: >-
      Name of the world created on the first start. Players find the server by searching this name
      (case sensitive) in the Public tab of the Worlds screen.
    order: 3
    env_variable: WORLD_NAME
    default_value: Dragonwilds World
    user_viewable: true
    user_editable: true
    rules:
      - required
      - string
      - max:32
  - name: World Password
    description: Password players need to join. Overrides the password stored in the world. Leave empty for none.
    order: 4
    env_variable: WORLD_PASSWORD
    default_value: ""
    user_viewable: true
    user_editable: true
    secret: true
    rules:
      - nullable
      - string
      - max:64
  - name: Admin Password
    description: >-
      Players who enter this password in Pause Menu > Settings > Server Management become admins and
      can ban online players.
    order: 5
    env_variable: ADMIN_PASSWORD
    default_value: ""
    user_viewable: true
    user_editable: true
    secret: true
    rules:
      - required
      - string
      - max:64
  - name: Admins
    description: Comma-separated Player IDs that always have admin rights. Leave empty for none.
    order: 6
    env_variable: ADMINS
    default_value: ""
    user_viewable: true
    user_editable: true
    rules:
      - nullable
      - string
      - max:512
      - 'regex:/^[A-Za-z0-9]{32}(,[A-Za-z0-9]{32})*$/'
  - name: Beacon Port
    description: UDP beacon port, the server's second port. Needs its own allocation.
    order: 7
    env_variable: BEACON_PORT
    default_value: "8888"
    user_viewable: true
    user_editable: false
    rules:
      - required
      - integer
      - between:1024,65535
  - name: Extra Arguments
    description: Additional server launch parameters.
    order: 8
    env_variable: EXTRA_ARGS
    default_value: ""
    user_viewable: true
    user_editable: true
    rules:
      - nullable
      - string
      - max:512
  - name: Auto Update
    description: Update the server through SteamCMD on every start. (1 = on, 0 = off)
    order: 9
    env_variable: AUTO_UPDATE
    default_value: "1"
    user_viewable: true
    user_editable: true
    rules:
      - required
      - in:0,1
  - name: Steam App ID
    description: Steam app id of the RuneScape Dragonwilds dedicated server.
    order: 10
    env_variable: SRCDS_APPID
    default_value: "4019830"
    user_viewable: false
    user_editable: false
    rules:
      - required
      - string
      - in:4019830
