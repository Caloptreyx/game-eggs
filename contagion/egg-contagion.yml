name: Contagion
author: thexylo@pm.me
description: >-
  Contagion, the cooperative zombie survival shooter on the Source engine: escape, extraction,
  hunted and panic modes. The Windows-only dedicated server (Steam app 293030) runs through Proton.
features:
  - steam_disk_space
docker_images:
  Proton: ghcr.io/caloptreyx/steamcmd:proton
file_denylist: []
startup_commands:
  # The server's own console is unusable under Proton, so its console log (-condebug) is streamed to
  # the panel, and console lines are sent to it over RCON (local only; the RCON password is
  # required). It gets a virtual display (Xvfb, in its own session so the stop signal does not take
  # it away); PROTON_USE_XALIA=0 stops Proton's accessibility helper from failing on it. Wine runs
  # the server in its own process group, so the stop signal never reaches it: the shell sends quit
  # over RCON instead and waits for it. Name and passwords are written to contagion/cfg/server.cfg
  # on every start.
  Default: >-
    mkdir -p contagion; : > contagion/console.log; rm -f /tmp/.X99-lock;
    setsid Xvfb :99 -screen 0 1024x768x24 -nolisten tcp 2>/dev/null & XVFB=$!;
    (while read -r line; do rcon -a "127.0.0.1:{{SERVER_PORT}}" -p "${RCON_PASSWORD}" "${line}"; done) <&0 &
    DISPLAY=:99 PROTON_USE_XALIA=0 SteamAppId=238430 proton run ./contagionds.exe -console -dedicated -game contagion
    -condebug -port {{SERVER_PORT}} +ip 0.0.0.0 -strictportbind +sv_lan 0 +maxplayers {{MAX_PLAYERS}} +map "{{SRCDS_MAP}}"
    {{EXTRA_ARGS}} >/dev/null 2>&1 & SRV=$!;
    trap 'rcon -a "127.0.0.1:{{SERVER_PORT}}" -p "${RCON_PASSWORD}" quit' INT;
    tail -n +1 -F contagion/console.log --pid=${SRV} 2>/dev/null &
    while kill -0 ${SRV} 2>/dev/null; do wait ${SRV}; done; kill ${XVFB} 2>/dev/null
force_outgoing_ip: false
separate_port: false
config:
  files:
    contagion/cfg/server.cfg:
      parser: file
      replace:
        - match: "hostname "
          replace_with: hostname "{{env.SERVER_NAME}}"
          insert_new: true
        - match: "sv_password "
          replace_with: sv_password "{{env.SERVER_PASSWORD}}"
          insert_new: true
        - match: "rcon_password "
          replace_with: rcon_password "{{env.RCON_PASSWORD}}"
          insert_new: true
  startup:
    done:
      - "Connection to Steam servers successful"
    strip_ansi: true
  stop:
    type: signal
    value: SIGINT
scripts:
  installation:
    container: ghcr.io/caloptreyx/installers:debian
    entrypoint: bash
    content: |
      #!/bin/bash
      # Contagion dedicated server installation script (Windows server, run through Proton)
      #
      # Server files: /mnt/server
      # Installer image: ghcr.io/caloptreyx/installers:debian

      SERVER_BINARY=/mnt/server/contagionds.exe

      # Calagopus Wings ignores the installer exit code and only marks the installation as failed when
      # a reason is written to INSTALL_STATUS_FILE. Pterodactyl Wings leaves it unset and uses the exit code.
      fail() {
          echo -e "\n[ERROR] $1\n"
          if [[ -n "${INSTALL_STATUS_FILE}" ]]; then
              echo "$1" > "${INSTALL_STATUS_FILE}"
          fi
          exit 1
      }

      ## download and install steamcmd
      cd /tmp || fail "cannot enter /tmp"
      mkdir -p /mnt/server/steamcmd /mnt/server/steamapps # steamapps: avoids a steamcmd disk write error
      curl -fsSL -o steamcmd.tar.gz https://steamcdn-a.akamaihd.net/client/installer/steamcmd_linux.tar.gz \
          || fail "could not download SteamCMD"
      tar -xzf steamcmd.tar.gz -C /mnt/server/steamcmd || fail "could not extract SteamCMD"
      cd /mnt/server/steamcmd || fail "cannot enter /mnt/server/steamcmd"

      # SteamCMD fails otherwise, even as root; ownership is fixed by the daemon after install.
      chown -R root:root /mnt
      export HOME=/mnt/server

      ## install the Windows server; the first attempt often fails with "Missing configuration"
      for attempt in 1 2 3; do
          ./steamcmd.sh +force_install_dir /mnt/server +@sSteamCmdForcePlatformType windows +login anonymous \
              +app_update "${SRCDS_APPID}" validate +quit && [[ -f "${SERVER_BINARY}" ]] && break
          echo "SteamCMD attempt ${attempt} failed, retrying..."
          sleep 5
      done
      [[ -f "${SERVER_BINARY}" ]] || fail "SteamCMD could not install app ${SRCDS_APPID}; check the install log and free disk space"

      ## steamclient libraries (Proton's Steam bridge loads the 32-bit one for this 32-bit server)
      mkdir -p /mnt/server/.steam/sdk32 /mnt/server/.steam/sdk64
      cp -v linux32/steamclient.so /mnt/server/.steam/sdk32/steamclient.so
      cp -v linux64/steamclient.so /mnt/server/.steam/sdk64/steamclient.so

      ## server.cfg: created when missing or blank; the panel keeps hostname and passwords in sync
      CFG=/mnt/server/contagion/cfg/server.cfg
      mkdir -p /mnt/server/contagion/cfg
      if ! grep -q '[^[:space:]]' "${CFG}" 2>/dev/null; then
          cat > "${CFG}" << 'EOF'
      // Contagion server configuration.
      // hostname, sv_password and rcon_password are set from the panel.
      hostname "Contagion Server"
      sv_password ""
      rcon_password ""

      sv_region 255
      sv_allowupload 0
      sv_allowdownload 1
      log on
      EOF
      fi

      echo "-----------------------------------------"
      echo "Installation completed..."
      echo "-----------------------------------------"
variables:
  - name: Server Name
    description: Name shown in the server browser. Cannot contain double quotes.
    order: 1
    env_variable: SERVER_NAME
    default_value: Contagion Server
    user_viewable: true
    user_editable: true
    rules: 'required|string|max:64|regex:/^[^"\r\n]+$/'
  - name: Map
    description: Map to load on start, e.g. ce_barlowe; the maps are the .bsp files in contagion/maps.
    order: 2
    env_variable: SRCDS_MAP
    default_value: ce_barlowe
    user_viewable: true
    user_editable: true
    rules: 'required|string|max:64|regex:/^[\w-]+$/'
  - name: Max Players
    description: Maximum number of players.
    order: 3
    env_variable: MAX_PLAYERS
    default_value: "8"
    user_viewable: true
    user_editable: true
    rules: "required|integer|between:1,16"
  - name: Server Password
    description: Password players need to join. Leave empty for no password. Cannot contain double quotes.
    order: 4
    env_variable: SERVER_PASSWORD
    default_value: ""
    user_viewable: true
    user_editable: true
    secret: true
    rules: 'nullable|string|max:64|regex:/^[^"\r\n]*$/'
  - name: RCON Password
    description: Remote console password, also used by the panel console and stop. No spaces or double quotes.
    order: 5
    env_variable: RCON_PASSWORD
    default_value: ""
    user_viewable: true
    user_editable: true
    secret: true
    rules: 'required|string|min:6|max:64|regex:/^[^"\s]+$/'
  - name: Extra Arguments
    description: Additional launch parameters or convars.
    order: 6
    env_variable: EXTRA_ARGS
    default_value: ""
    user_viewable: true
    user_editable: true
    rules: "nullable|string|max:512"
  - name: Auto Update
    description: Update the server through SteamCMD on every start. (1 = on, 0 = off)
    order: 7
    env_variable: AUTO_UPDATE
    default_value: "1"
    user_viewable: true
    user_editable: true
    rules: "required|in:0,1"
  - name: Steam App ID
    description: Steam app id of the Contagion dedicated server.
    order: 8
    env_variable: SRCDS_APPID
    default_value: "293030"
    user_viewable: false
    user_editable: false
    rules: "required|string|in:293030"
  - name: Windows Install
    description: The server is Windows-only; auto updates must download the Windows files.
    order: 9
    env_variable: WINDOWS_INSTALL
    default_value: "1"
    user_viewable: false
    user_editable: false
    rules: "required|in:1"
