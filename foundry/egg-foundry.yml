name: FOUNDRY
author: thexylo@pm.me
description: >-
  FOUNDRY, the first-person factory building and automation game in an infinite voxel world: mine,
  build production lines, research and expand into space, together. The Windows-only dedicated
  server (Steam app 2915550) runs through Proton.
features:
  - steam_disk_space
docker_images:
  Proton: ghcr.io/caloptreyx/steamcmd:proton
file_denylist: []
startup_commands:
  # Name, password, ports, visibility, player limit, world, seed, autosave and pause settings are
  # written to App.cfg on every start (seeded by the installer); saves and logs go to saves/. The
  # server needs a display (Xvfb) and the game's Steam app id (983870). Its Unity log is written to
  # server_output.log and streamed to the console; it reads no console input. A signal kills it
  # without saving, so the server runs in its own session and the shell catches the stop signal
  # (SIGINT): it asks the server window to close (wine taskkill), which saves the world and exits.
  Default: >-
    echo 983870 > steam_appid.txt; export SteamAppId=983870 SteamGameId=983870;
    rm -f server_output.log; touch server_output.log;
    setsid xvfb-run -a proton run ./FoundryDedicatedServer.exe -batchmode -nographics -logFile server_output.log >/dev/null 2>&1 & SRV=$!;
    trap 'echo "Saving the world and stopping..."; WINEPREFIX="${STEAM_COMPAT_DATA_PATH}/pfx" "$(dirname "$(command -v proton)")/files/bin/wine" taskkill /IM FoundryDedicatedServer.exe >/dev/null 2>&1' INT TERM;
    tail -n +1 -F server_output.log --pid=${SRV} 2>/dev/null &
    while kill -0 ${SRV} 2>/dev/null; do wait ${SRV}; done
force_outgoing_ip: false
separate_port: false
config:
  files:
    App.cfg:
      parser: file
      replace:
        - match: "server_name="
          replace_with: "server_name={{env.SERVER_NAME}}"
        - match: "server_password="
          replace_with: "server_password={{env.SERVER_PASSWORD}}"
        - match: "server_world_name="
          replace_with: "server_world_name={{env.WORLD_NAME}}"
        - match: "server_max_players="
          replace_with: "server_max_players={{env.MAX_PLAYERS}}"
        - match: "server_port="
          replace_with: "server_port={{server.build.default.port}}"
        - match: "server_query_port="
          replace_with: "server_query_port={{env.QUERY_PORT}}"
        - match: "server_is_public="
          replace_with: "server_is_public={{env.PUBLIC}}"
        - match: "pause_server_when_empty="
          replace_with: "pause_server_when_empty={{env.PAUSE_WHEN_EMPTY}}"
        - match: "autosave_interval="
          replace_with: "autosave_interval={{env.AUTOSAVE_INTERVAL}}"
        - match: "mapseed="
          replace_with: "mapseed={{env.MAP_SEED}}"
        - match: "server_persistent_data_override_folder="
          replace_with: "server_persistent_data_override_folder=Z:/home/container/saves"
  startup:
    done:
      - "Dedicated server is now running!"
    strip_ansi: true
  stop:
    type: signal
    value: SIGINT
scripts:
  installation:
    container: ghcr.io/caloptreyx/installers:debian
    entrypoint: bash
    content: |
      #!/bin/bash
      # FOUNDRY dedicated server installation script (Windows server, run through Proton)
      #
      # Server files: /mnt/server
      # Installer image: ghcr.io/caloptreyx/installers:debian

      SERVER_BINARY=/mnt/server/FoundryDedicatedServer.exe

      # Calagopus Wings ignores the installer exit code and only marks the installation as failed when
      # a reason is written to INSTALL_STATUS_FILE. Pterodactyl Wings leaves it unset and uses the exit code.
      fail() {
          echo -e "\n[ERROR] $1\n"
          if [[ -n "${INSTALL_STATUS_FILE}" ]]; then
              echo "$1" > "${INSTALL_STATUS_FILE}"
          fi
          exit 1
      }

      ## download and install steamcmd
      cd /tmp || fail "cannot enter /tmp"
      mkdir -p /mnt/server/steamcmd /mnt/server/steamapps # steamapps: avoids a steamcmd disk write error
      curl -fsSL -o steamcmd.tar.gz https://steamcdn-a.akamaihd.net/client/installer/steamcmd_linux.tar.gz \
          || fail "could not download SteamCMD"
      tar -xzf steamcmd.tar.gz -C /mnt/server/steamcmd || fail "could not extract SteamCMD"
      cd /mnt/server/steamcmd || fail "cannot enter /mnt/server/steamcmd"

      # SteamCMD fails otherwise, even as root; ownership is fixed by the daemon after install.
      chown -R root:root /mnt
      export HOME=/mnt/server

      for attempt in 1 2 3; do
          ./steamcmd.sh +force_install_dir /mnt/server +@sSteamCmdForcePlatformType windows +login anonymous \
              +app_update "${SRCDS_APPID}" validate +quit && [[ -f "${SERVER_BINARY}" ]] && break
          echo "SteamCMD attempt ${attempt} failed, retrying..."
          sleep 5
      done
      [[ -f "${SERVER_BINARY}" ]] || fail "SteamCMD could not install app ${SRCDS_APPID}; check the install log and free disk space"

      ## steamclient libraries
      mkdir -p /mnt/server/.steam/sdk32 /mnt/server/.steam/sdk64
      cp -v linux32/steamclient.so /mnt/server/.steam/sdk32/steamclient.so
      cp -v linux64/steamclient.so /mnt/server/.steam/sdk64/steamclient.so

      ## App.cfg: seeded once with every documented option so the panel can apply its values
      cd /mnt/server || fail "cannot enter /mnt/server"
      mkdir -p saves
      if [[ ! -f App.cfg ]]; then
          cat > App.cfg << 'EOF'
      server_name=FOUNDRY Server
      server_password=
      server_world_name=MyFoundry
      server_max_players=32
      server_port=3724
      server_query_port=27015
      server_is_public=true
      pause_server_when_empty=true
      autosave_interval=300
      mapseed=42938743982
      server_persistent_data_override_folder=Z:/home/container/saves
      EOF
      fi

      echo "-----------------------------------------"
      echo "Installation completed..."
      echo "-----------------------------------------"
variables:
  - name: Server Name
    description: Name shown in the Steam server browser.
    order: 1
    env_variable: SERVER_NAME
    default_value: FOUNDRY Server
    user_viewable: true
    user_editable: true
    rules: 'required|string|max:64|regex:/^[^\r\n]+$/'
  - name: Server Password
    description: Password players need to join. Leave empty for no password.
    order: 2
    env_variable: SERVER_PASSWORD
    default_value: ""
    user_viewable: true
    user_editable: true
    secret: true
    rules: 'nullable|string|max:64|regex:/^\S*$/'
  - name: Max Players
    description: Maximum number of players.
    order: 3
    env_variable: MAX_PLAYERS
    default_value: "32"
    user_viewable: true
    user_editable: true
    rules: "required|integer|between:1,64"
  - name: World Name
    description: World (save folder in saves/save/); a new name creates a new world.
    order: 4
    env_variable: WORLD_NAME
    default_value: MyFoundry
    user_viewable: true
    user_editable: true
    rules: 'required|string|max:64|regex:/^[\w-]+$/'
  - name: Map Seed
    description: Seed of a new world.
    order: 5
    env_variable: MAP_SEED
    default_value: "42938743982"
    user_viewable: true
    user_editable: true
    rules: "required|integer|between:0,18446744073709551615"
  - name: Public
    description: List the server in the Steam server browser. (true or false)
    order: 6
    env_variable: PUBLIC
    default_value: "true"
    user_viewable: true
    user_editable: true
    rules: "required|in:true,false"
  - name: Pause When Empty
    description: Pause the world while nobody is connected. (true or false)
    order: 7
    env_variable: PAUSE_WHEN_EMPTY
    default_value: "true"
    user_viewable: true
    user_editable: true
    rules: "required|in:true,false"
  - name: Autosave Interval
    description: Seconds between autosaves.
    order: 8
    env_variable: AUTOSAVE_INTERVAL
    default_value: "300"
    user_viewable: true
    user_editable: true
    rules: "required|integer|between:30,86400"
  - name: Query Port
    description: UDP port for Steam server queries (used when public). Needs its own allocation.
    order: 9
    env_variable: QUERY_PORT
    default_value: "27015"
    user_viewable: true
    user_editable: false
    rules: "required|integer|between:1024,65535"
  - name: Auto Update
    description: Update the server through SteamCMD on every start. (1 = on, 0 = off)
    order: 10
    env_variable: AUTO_UPDATE
    default_value: "1"
    user_viewable: true
    user_editable: true
    rules: "required|in:0,1"
  - name: Windows Install
    description: Download the Windows build through SteamCMD.
    order: 11
    env_variable: WINDOWS_INSTALL
    default_value: "1"
    user_viewable: false
    user_editable: false
    rules: "required|in:1"
  - name: Steam App ID
    description: Steam app id of the FOUNDRY dedicated server.
    order: 12
    env_variable: SRCDS_APPID
    default_value: "2915550"
    user_viewable: false
    user_editable: false
    rules: "required|string|in:2915550"
